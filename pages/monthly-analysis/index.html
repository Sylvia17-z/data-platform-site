<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月度分析面板</title>
<style>
  :root{
    /* 藏蓝主题色板（与数据统计平台统一） */
    --navy:#002060;
    --navy-900:#003366;
    --navy-700:#0a4ea3;
    --navy-100:#d6e0f0;
    --navy-50:#f3f6fb;
    --light-blue:#D7EFF9;
    --ink:#0f172a;
    --ink-soft:#5b6472;
    --line:#000000;
    --up:#c0392b;      /* 上涨/注意=红（中式习惯） */
    --down:#0a7d3b;    /* 下降/达标=绿 */
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",Helvetica,Arial,sans-serif;
    /* 复用医管考核规范的辅助令牌（toolbar / 月份多选浮层） */
    --navy-500:#03539f;
    --ok:#0a7d4d;
    --ok-bg:#e6f5ec;
    --no:#b42318;
    --no-bg:#fdecec;
    --shadow-1:0 1px 3px rgba(1,42,94,.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:var(--font);color:var(--ink);
    background:linear-gradient(170deg,#eef3fa 0%,#e2ebf6 60%,#dbe7f4 100%);
    font-size:14px;line-height:1.5;min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:16px 20px 40px;}

  /* 2026-11-05：移除页首标题栏（.topbar）—— 壳层已有页签与标题，子页不再重复。
     本机缓存状态徽章迁到导入工具栏内，状态仍一眼可见。 */
  /* 本机缓存状态徽章（2026-11-05）：把「刷新会不会丢」变成一眼可见的事实 */
  .save-chip{
    font-size:12px;line-height:1.6;border-radius:999px;padding:4px 11px;cursor:pointer;
    border:1px solid var(--navy-100);background:#f6f9fd;color:#41526b;white-space:nowrap;
    font-family:var(--font);user-select:none;
  }
  .save-chip.saved{border-color:#b7e3c4;background:#eefaf1;color:#166534;}
  .save-chip.saving{border-color:#c9d9ee;background:#eef3fa;color:#1e3a8a;}
  .save-chip.error{border-color:#f3c6a5;background:#fff7ed;color:#b45309;}
  .save-chip:hover{filter:brightness(.98);}
  .save-chip:focus-visible{outline:2px solid var(--navy-500);outline-offset:2px;}
  .month-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--navy-100);background:#fff;color:var(--navy);
    border-radius:999px;padding:4px 14px;font-size:12.5px;font-family:inherit;
    cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap;
  }
  .chip:hover{border-color:var(--navy-700);background:var(--navy-50);}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(1,65,139,.25);}

  /* ===== 导入区：改用与医管考核一致的 .toolbar / .fbar 规范（2026-10-22） ===== */
  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fff;border:1px solid var(--navy-100);border-radius:10px;
    padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow-1);
  }
  .toolbar.drag{border-color:var(--navy-700);background:var(--navy-50);}
  .toolbar .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .toolbar .gl{font-size:12.5px;color:var(--ink-soft);}
  .toolbar label.fbtn{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    background:var(--navy);color:#fff;border-radius:7px;padding:6px 12px;font-size:13px;
    border:1px solid var(--navy);transition:.15s;height:32px;
  }
  .toolbar label.fbtn:hover{background:var(--navy-700);}
  .toolbar label.fbtn.opt{background:#fff;color:var(--navy);}
  .toolbar label.fbtn.opt:hover{background:var(--navy-50);}
  .toolbar input[type=file]{display:none;}
  .toolbar .hint{color:var(--ink-soft);font-size:12px;}
  .toolbar select,.toolbar .btn{
    font-family:var(--font);font-size:13px;border:1px solid var(--navy-100);
    border-radius:7px;padding:6px 10px;background:#fff;color:var(--ink);cursor:pointer;height:32px;
  }
  .toolbar .btn{border-color:var(--navy);color:var(--navy);}
  .toolbar .btn:hover{background:var(--navy-50);}
  .toolbar select:hover{border-color:var(--navy-500);}
  /* 月份多选筛选浮层（.fbar/.ftoggle/.fitem/.flabel 由 shared/filterbar.css 提供） */
  .toolbar .proj-filter{position:relative;}
  .toolbar .proj-filter-btn{font-family:var(--font);font-size:13px;border:1px solid var(--navy-100);border-radius:7px;padding:6px 10px;background:#fff;color:var(--ink);cursor:pointer;min-width:84px;text-align:left;height:32px;}
  .toolbar .proj-filter-btn:hover{background:var(--navy-50);}
  .proj-filter-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:#fff;border:1px solid var(--navy-100);border-radius:8px;box-shadow:0 6px 20px rgba(20,40,80,.14);padding:6px;min-width:180px;max-height:320px;overflow:auto;}
  .proj-filter-pop .pf-row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;}
  .proj-filter-pop .pf-row:hover{background:var(--navy-50);}
  .proj-filter-pop .pf-row input{accent-color:var(--navy);width:15px;height:15px;flex:0 0 auto;}
  .proj-filter-pop .pf-cats{border-top:1px solid var(--navy-100);border-bottom:1px solid var(--navy-100);margin:4px 0;padding:4px 0;}
  .file-meta{font-size:12px;color:var(--ink-soft);}
  .merge-opt{font-size:12px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
  .merge-opt input{cursor:pointer;margin:0;}
  .btn{
    cursor:pointer;border:1px solid var(--navy-100);background:#fff;color:var(--ink);
    border-radius:6px;padding:6px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;transition:all .15s ease;user-select:none;white-space:nowrap;
  }
  .btn:hover{border-color:var(--navy-700);color:var(--navy-700);box-shadow:0 2px 8px rgba(1,65,139,.12);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn-primary:hover{background:var(--navy-900);color:#fff;border-color:var(--navy-900);box-shadow:0 4px 12px rgba(0,32,96,.25);}
  #file{display:none;}
  .status{margin-top:10px;font-size:12.5px;min-height:18px;}
  .status.ok{color:#0a7d3b;}
  .status.err{color:#c0392b;}
  .drop-hint{font-size:11.5px;color:var(--ink-soft);}

  /* ===== 表卡壳 ===== */
  .card{background:#fff;border:1px solid var(--navy-100);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(1,65,139,.06);margin-bottom:16px;}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--navy-900);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card h3 .t{display:flex;align-items:center;}
  .card h3 .bar{display:inline-block;width:4px;height:14px;background:var(--navy);border-radius:2px;margin-right:8px;vertical-align:-2px;}
  .card h3 .tag{font-size:11px;color:var(--ink-soft);font-weight:400;}
  .tbl-ops{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--navy-100);background:var(--navy-50);color:var(--navy);
    border-radius:7px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .table-card{overflow:auto;border-radius:8px;}
  .mt-note{display:none;margin-top:8px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;}

  /* ===== 统计表（按用户参考图版式） ===== */
  table.mt{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums;min-width:640px;}
  table.mt th,table.mt td{border:1px solid var(--line);padding:6px 9px;text-align:right;white-space:nowrap;}
  table.mt thead th{background:var(--navy);color:#fff;font-weight:600;text-align:center;position:sticky;top:0;z-index:1;}
  table.mt td.dept{background:var(--navy-100);color:var(--navy-900);font-weight:700;text-align:center;vertical-align:middle;}
  table.mt td.clinic{background:var(--navy-50);color:var(--navy-900);font-weight:600;text-align:center;}
  table.mt td.doc,table.mt td.doc-lbl{text-align:left;background:#fff;color:var(--ink);}
  table.mt tbody tr:nth-child(even) td.doc,
  table.mt tbody tr:nth-child(even) td.doc-lbl{background:#fbfcfe;}
  table.mt td.num{text-align:right;}
  table.mt td.dim{color:var(--ink-soft);}
  table.mt tr.sum td{background:var(--light-blue)!important;font-weight:700;}
  table.mt tr.sum td.sum-lbl{text-align:center;}
  table.mt tr.total td{background:var(--navy-100)!important;font-weight:700;}
  table.mt tr.total td.sum-lbl{text-align:center;}
  table.mt tr.wu-row td.doc{color:var(--ink-soft);}

  /* 明细下钻：行可点击 + 弹层 */
  table.mt tbody tr[data-drill]{cursor:pointer;}
  table.mt tbody tr[data-drill]:hover td{filter:brightness(.93);}
  .drill-mask{position:fixed;inset:0;background:rgba(15,35,64,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;}
  .drill-card{background:#fff;border-radius:10px;max-width:920px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);}
  .drill-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--navy-100);font-weight:700;color:var(--navy-900);font-size:14px;}
  .drill-head button{border:1px solid var(--navy-100);background:var(--navy-50);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--navy);font-size:13px;line-height:1;}
  .drill-head button:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .drill-filter{flex:1;max-width:360px;height:28px;padding:0 10px;margin:0 10px;border:1px solid var(--navy-100);border-radius:6px;font-family:inherit;font-size:12.5px;color:var(--ink);background:#fff;}
  .drill-filter:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 2px rgba(10,78,163,.15);}
  .drill-sum td{background:var(--navy-100);font-weight:700;border-top:2px solid var(--navy);}
  .drill-sum td.sum-lbl{text-align:center;}
  .drill-meta{padding:8px 16px;font-size:12.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);}
  .drill-body{overflow:auto;padding:0 16px 16px;}
  .drill-body table.mt thead th{position:sticky;top:0;}

  /* 目标输入框 */
  .tgt-input{
    width:110px;height:26px;padding:0 8px;text-align:right;font-family:inherit;font-size:12.5px;
    border:1px solid var(--navy-100);border-radius:5px;background:#fff;color:var(--ink);
  }
  .tgt-input:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 2px rgba(10,78,163,.15);}
  .tgt-input:disabled{background:#f4f5f7;color:var(--ink-soft);cursor:not-allowed;}
  td.tgt-cell{text-align:center;}
  .rate{font-weight:600;}
  .rate.good{color:var(--down);}
  .rate.bad{color:var(--up);}

  /* 月度业绩完成情况（2026-10-23：与表A/表B配色统一——藏蓝表头白字 + 浅蓝合计行，去掉灰表头/钢蓝行） */
  table.mt.channel thead th{background:var(--navy);color:#fff;font-weight:600;}
  table.mt.channel thead th.tl{text-align:left;}
  table.mt.channel tbody td{background:#fff;}
  table.mt.channel tr.ch-sum td{background:var(--light-blue)!important;font-weight:700;}
  table.mt.channel tr.hosp-target td{background:var(--navy-100)!important;color:var(--navy-900);font-weight:700;}
  table.mt.channel tr.year-total td{background:var(--navy-50)!important;font-weight:700;}

  /* ===== 顶部 KPI 概览（方案B·专业 BI 紧凑：白卡 + 左侧藏蓝强调条 + 紧凑字号） ===== */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px;}
  .ktile{position:relative;overflow:hidden;background:#fff;border:1px solid var(--navy-100);border-radius:10px;padding:13px 16px 13px 18px;box-shadow:0 1px 3px rgba(1,65,139,.06);}
  .ktile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy);}
  .ktile .kl{font-size:11.5px;color:var(--ink-soft);margin-bottom:7px;}
  .ktile .kv{font-size:21px;font-weight:700;color:var(--navy-900);letter-spacing:.2px;font-variant-numeric:tabular-nums;line-height:1.15;}
  .ktile .kv .ku{font-size:12px;color:var(--ink-soft);font-weight:500;margin-left:3px;}
  .ktile .ks{font-size:11.5px;margin-top:6px;color:var(--ink-soft);}
  .ktile .ks.g{color:var(--down);} .ktile .ks.b{color:var(--up);}
  @media(max-width:900px){ .kpis{grid-template-columns:repeat(2,1fr);} }

  .empty{color:var(--ink-soft);text-align:center;padding:60px 0;font-size:14px;}
  @media(max-width:640px){
    table.mt{min-width:560px;}
    .tgt-input{width:92px;}
    .tbl-ops{width:100%;}
  }
</style>

<body>
<div class="wrap">

  <div class="toolbar" id="importCard">
    <div class="dataseg">
      <span class="seg-label">数据</span>
      <label class="fbtn" title="导入「订单项目收退款表-明细」同结构文件；支持一次多选多个月份文件">📥 导入数据明细
        <input type="file" id="file" accept=".xlsx,.xls" multiple />
      </label>
      <span class="fitem" style="flex-direction:row;align-items:center;gap:6px;">
        <span class="flabel" style="width:auto;">导入方式</span>
        <select id="orderImportMode" class="fctl" style="width:auto;height:32px;">
          <option value="append">合并导入</option>
          <option value="replace">覆盖导入</option>
        </select>
      </span>
      <span class="push"></span>
      <span class="save-chip idle" id="saveChip" role="button" tabindex="0" title="本机缓存状态">○ 尚未导入数据</span>
      <button type="button" class="btn danger" id="btnClearData" title="清空已导入的全部数据与业绩目标（需二次确认）">🗑 清空数据</button>
    </div>
    <div class="fbar">
      <button type="button" class="ftoggle" data-fbar="ma"><span>⚙</span><span>筛选</span><span class="ft-caret">▴</span></button>
      <div class="fbody">
        <span class="fitem proj-filter"><span class="flabel">月份（多选）</span>
          <button type="button" class="proj-filter-btn" id="monthBtn">全部月份</button>
          <div class="proj-filter-pop" id="monthPop" style="display:none;">
            <label class="pf-row"><input type="checkbox" class="pf-cb" data-v="__all__" checked /> 全部</label>
            <div class="pf-cats" id="monthCats"></div>
          </div>
        </span>
      </div>
    </div>
    <span class="hint" id="fMeta" style="width:100%;">未导入</span>
    <div class="status" id="status" style="flex-basis:100%;"></div>
  </div>

  <div class="kpis" id="kpis" style="display:none">
    <div class="ktile"><div class="kl">全院合计 · 现款支付</div><div class="kv" id="kpiCash">0<span class="ku">元</span></div><div class="ks" id="kpiCashSub">&nbsp;</div></div>
    <div class="ktile"><div class="kl">消耗业绩</div><div class="kv" id="kpiCons">0<span class="ku">元</span></div><div class="ks" id="kpiConsSub">&nbsp;</div></div>
    <div class="ktile"><div class="kl">全院容量（去重会员）</div><div class="kv" id="kpiMem">0<span class="ku">人</span></div><div class="ks" id="kpiMemSub">&nbsp;</div></div>
    <div class="ktile"><div class="kl">管家目标完成率</div><div class="kv" id="kpiRate">—</div><div class="ks" id="kpiRateSub">&nbsp;</div></div>
  </div>

  <div id="tables" style="display:none">
    <section class="card" id="cardDept">
      <h3><span class="t"><span class="bar"></span>月度各科室业绩统计分析</span>
        <span class="tbl-ops"><span class="tag" id="deptTag"></span>
        <button type="button" class="btn" id="btnXlsxDept" title="导出表A（样式与页面显示完全一致）">导出表A</button></span></h3>
      <div class="table-card"><table class="mt" id="tblDept"></table></div>
      <div class="mt-note" id="deptNote"></div>
    </section>
    <section class="card" id="cardMgr">
      <h3><span class="t"><span class="bar"></span>月度管家业绩统计分析（健康管家）</span>
        <span class="tbl-ops"><span class="tag" id="mgrTag"></span>
        <button type="button" class="btn" id="btnXlsxMgr" title="导出表B（样式与页面显示完全一致）">导出表B</button></span></h3>
      <div class="table-card"><table class="mt" id="tblMgr"></table></div>
      <div class="mt-note" id="mgrNote"></div>
    </section>
    <section class="card" id="cardChannel">
      <h3><span class="t"><span class="bar"></span>月度业绩完成情况</span>
        <span class="tbl-ops"><span class="tag" id="chTag"></span>
        <button type="button" class="btn" id="btnXlsxChannel" title="导出月度业绩完成情况（样式与页面显示完全一致）">导出</button></span></h3>
      <div class="table-card"><table class="mt channel" id="tblChannel"></table></div>
      <div class="mt-note" id="chNote"></div>
    </section>
  </div>

  <div id="placeholder" class="empty">尚未导入数据 —— 请先选择 Excel 文件。
    <div id="phCache" style="display:none;margin-top:14px;">
      <button type="button" class="btn" id="btnLoadCache">↻ 载入本机上次的数据</button>
      <div id="phCacheMeta" style="margin-top:8px;font-size:12px;color:var(--ink-soft);"></div>
    </div>
  </div>

  <div class="drill-mask" id="drillMask">
    <div class="drill-card">
      <div class="drill-head"><span id="drillTitle">明细下钻</span><input id="drillFilter" class="drill-filter" type="text" placeholder="筛选：姓名 / 会员号 / 科室 / 医生 / 咨询师" /><button type="button" id="drillClose" title="关闭（Esc）">✕</button></div>
      <div class="drill-meta" id="drillMeta"></div>
      <div class="drill-body"><table class="mt" id="drillTbl"></table></div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var file=document.getElementById('file'), status=document.getElementById('status');
  var importCard=document.getElementById('importCard');
  file.addEventListener('change',function(e){ var fs=Array.from(e.target.files||[]); if(fs.length) loadFiles(fs); });
  ['dragover','dragenter'].forEach(function(ev){importCard.addEventListener(ev,function(e){e.preventDefault();importCard.classList.add('drag');});});
  ['dragleave','drop'].forEach(function(ev){importCard.addEventListener(ev,function(e){e.preventDefault();importCard.classList.remove('drag');});});
  importCard.addEventListener('drop',function(e){ var fs=e.dataTransfer&&Array.from(e.dataTransfer.files||[]); if(fs&&fs.length) loadFiles(fs); });

  function setStatus(msg,type){ status.textContent=msg; status.className='status'+(type?(' '+type):''); }

  /* ---------- 列头解析：别名数组 + 精确优先 + 包含兜底 + 命中锁定 ---------- */
  var COLS={
    ym:['日期','收款时间','收款日期'],
    cash:['收款金额-现款支付','现款支付'],
    asset:['收款金额-资产抵扣','资产抵扣'],
    dept:['关联订单信息-订单开单科室','订单开单科室','开单科室'],
    doctor:['订单所属-订单分诊医生','订单分诊医生','分诊医生'],

  function resolveHeaders(headers){
    var map={}, used={}, keys=Object.keys(COLS);
    function lock(i,key){ used[i]=1; map[key]=headers[i]; }
    // pass1：按别名顺序做精确匹配（别名数组顺序即优先级）
    keys.forEach(function(k){
      var kws=COLS[k];
      for(var a=0;a<kws.length;a++){
        for(var i=0;i<headers.length;i++){
          if(!headers[i]||used[i]) continue;
          if(String(headers[i])===kws[a]){ lock(i,k); return; }
        }
      }
    });
    // pass2：包含兜底（跳过已被其他字段占用的表头，防止一列两吃）
    keys.forEach(function(k){
      if(map[k]!=null) return;
      var kws=COLS[k];
      for(var a=0;a<kws.length;a++){
        for(var i=0;i<headers.length;i++){
          if(!headers[i]||used[i]) continue;
          if(String(headers[i]).indexOf(kws[a])>=0){ lock(i,k); return; }
        }
      }
    });
    return map;
  }

  function num(v){ if(v===null||v===undefined||v==='') return 0; var n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; }

    var d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);

  /* Excel 日期序列号（如 46293）必须按 1899-12-30 基准换算，
     否则 new Date("46293") 会被解析成公元 46293 年 → 产生大量假月份 */
  function monthKey(v){
    if(v===null||v===undefined||v==='') return null;
    if(typeof v==='number'){ if(v>20000&&v<80000) return excelMonth(v); }
    var s=String(v).trim();
    if(/^\d+(\.\d+)?$/.test(s)){ var n=parseFloat(s); if(n>20000&&n<80000) return excelMonth(n); }

    if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
    return null;
  }

  /* ---------- 本机持久化（2026-11-05）：不点「清空数据」，刷新就不丢 ----------
     背景：本页原先只靠云端 dp_monthly 快照持久化，而管理员本地账号会被
     kpi-cloud-sync 整体跳过（adminMode 直接 return）→ 刷新即丢，每次都要重新导入。
     存储：IndexedDB「monthlyDash/kv」存整包（真实订单明细约 3~5MB，localStorage 放不下）；
           localStorage 只存轻量指纹（ts / 行数 / 文件名 / 月份选择），供快速判空与备份核对。
     读取：IDB 为主；IDB 不可用（隐私模式等）时才退回 localStorage 完整副本。
     不做「多副本择优」：两份内容同源，按 ts 取新即可，避免又出现挑到旧副本的问题。 */
  var LD_META_KEY='monthly_dash_meta_v1';
  var LD_FULL_KEY='monthly_dash_v1';
  var LD_DB='monthlyDash', LD_STORE='kv', LD_KEY='dash';
  var ldTimer=0, ldBusy=false, ldPending=false;

  function ldOpen(){
    return new Promise(function(res,rej){
      var req;
      try{ req=indexedDB.open(LD_DB,1); }catch(e){ rej(e); return; }
      req.onupgradeneeded=function(){ try{ req.result.createObjectStore(LD_STORE); }catch(e){} };
      req.onsuccess=function(){ res(req.result); };
      req.onerror=function(){ rej(req.error||new Error('idb-open')); };
      req.onblocked=function(){ rej(new Error('idb-blocked')); };
    });
  }
  function ldGet(){
    return ldOpen().then(function(db){
      return new Promise(function(res){
        var tx;
        try{ tx=db.transaction(LD_STORE,'readonly'); }catch(e){ try{db.close();}catch(_){} return res(null); }
        var rq=tx.objectStore(LD_STORE).get(LD_KEY);
        rq.onsuccess=function(){ var v=rq.result; try{db.close();}catch(e){} res(v==null?null:v); };
        rq.onerror=function(){ try{db.close();}catch(e){} res(null); };
      });
    }).catch(function(){ return null; });
  }
  function ldPut(str){
    return ldOpen().then(function(db){
      return new Promise(function(res,rej){
        var tx;
        try{ tx=db.transaction(LD_STORE,'readwrite'); }catch(e){ try{db.close();}catch(_){} return rej(e); }
        tx.objectStore(LD_STORE).put(str,LD_KEY);
        tx.oncomplete=function(){ try{db.close();}catch(e){} res(true); };
        tx.onerror=tx.onabort=function(){ var er=tx.error; try{db.close();}catch(e){} rej(er||new Error('idb-put')); };
      });
    });
  }
  function ldDel(){
    return ldOpen().then(function(db){
      return new Promise(function(res){
        var tx;
        try{ tx=db.transaction(LD_STORE,'readwrite'); }catch(e){ try{db.close();}catch(_){} return res(); }
        tx.objectStore(LD_STORE).delete(LD_KEY);
        tx.oncomplete=tx.onerror=tx.onabort=function(){ try{db.close();}catch(e){} res(); };
      });
    }).catch(function(){});
  }

      if(ldState.status!=='saved') paintChip();

    var json;

    catch(e){ ldState={status:'error',ts:0,n:d.rows.length,msg:'数据序列化失败'}; paintChip(); return; }

    ldState={status:'saving',ts:0,n:d.rows.length,msg:''}; paintChip();

        ldState={status:'error',ts:0,n:d.rows.length,msg:'浏览器存储空间不足'}; paintChip();

  /* 空态下告诉用户「本机其实有缓存」，并给一个手动载入入口（自动读取失败时的兜底） */

  function loadLocalDash(){
    var lsFull=null, meta=null;

    }catch(e){}
    try{ meta=JSON.parse(localStorage.getItem(LD_META_KEY)||'null'); }catch(e){}
    return ldGet().then(function(str){
      var pack=null;
      try{ if(str) pack=(typeof str==='string')?JSON.parse(str):str; }catch(e){}
      if(lsFull&&(!pack||(Number(lsFull.ts)||0)>(Number(pack.ts)||0))) pack=lsFull;

          if(typeof window.__maSyncMonthUI==='function') window.__maSyncMonthUI();
          renderDashboard();
          saveLocalDash();
        }
      }
      return true;
    }).catch(function(){ return false; });
  }

  /* ---------- 月份多选：选中集合（空=全部导入月） + 焦点月（最新选中月） ---------- */
  function activeMonths(){
    if(dash.selMonths && dash.selMonths.length) return dash.selMonths;
    return dash.months || [];
  }
  function activeScope(){
    // 月份多选为空 ⇒ 全部月份（聚合口径，键位 '__all__'：下钻/目标/单月筛选都按全量）；
    // 否则取最新选中月作为「焦点月」。注意：不能用 activeMonths() 取末尾月——空选时 activeMonths 返回
    // 全部导入月（用于渠道/年度聚合），若这里也取末尾月会把「全部」误判成单月，导致合计与口径错乱。
    if(dash.selMonths && dash.selMonths.length) return dash.selMonths[dash.selMonths.length-1];
    return '__all__';
  }
  function renderMonthPop(){
    var box=document.getElementById('monthCats');
    if(!box) return;
    box.innerHTML = (dash.months||[]).map(function(m){
      return '<label class="pf-row"><input type="checkbox" class="pf-cb" data-v="'+m+'" /> '+m+'</label>';
    }).join('');

    if(btn) btn.textContent = (dash.months&&dash.months.length) ? '全部月份' : '未导入数据';
  }

  /* 行级日期键（YYYY-MM-DD）：用于「补充导入」时按日期判断重叠
     —— 与日业绩页 mergeOrdersByDate 同语义：重叠日期整批用新文件覆盖，其它日期保留 */
  function rowDateKey(r,map){
    var v=(map.ym!=null)?r[map.ym]:((map.date!=null)?r[map.date]:null);
    if(v==null||v==='') return null;
    var s=String(v).trim();
    var m=s.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
    if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
    var n=Number(s);
    if(isFinite(n)&&n>20000&&n<80000){
      var d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);
      return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2);
    }
    return null;
  }
  function mergeRowsByDate(existing, incoming, map){
    var incDates=new Set();
    incoming.forEach(function(r){ var d=rowDateKey(r,map); if(d) incDates.add(d); });
    var kept=existing.filter(function(r){ var d=rowDateKey(r,map); return !d || !incDates.has(d); });
    return { rows: kept.concat(incoming), replaced: existing.length-kept.length, coveredDates: incDates.size };
  }

  function parseArrayBuffer(buf, fname){
    try{
      var wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      var ws=wb.SheetNames.length?wb.Sheets[wb.SheetNames[0]]:null;
      if(!ws) return {ok:false,msg:'文件中没有可读取的工作表。'};
      var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length) return {ok:false,msg:'工作表为空，请检查数据。'};
      var headers=Object.keys(rows[0]);
      var map=resolveHeaders(headers);
      if(map.cash==null) return {ok:false,msg:'未匹配到关键列（收款金额-现款支付），请确认文件结构。'};
      if(map.ym==null&&map.date==null) return {ok:false,msg:'未匹配到月份列（日期 / 收款时间），请确认文件结构。'};
      var miss=[];
      if(map.dept==null) miss.push('订单开单科室');
      if(map.doctor==null) miss.push('订单分诊医生');
      if(map.consultant==null) miss.push('开单咨询师');
      if(map.member==null) miss.push('会员号');
      return {ok:true, rows:rows, map:map, miss:miss};
    }catch(err){ return {ok:false, msg:'解析失败：'+err.message}; }
  }
  function importRows(rows, map, fname, miss){
    // 导入方式：合并导入（默认）= 补充导入（重叠日期覆盖、其它日期保留）；覆盖导入 = 清空后重新导入
    var modeSel = document.getElementById('orderImportMode');
    var doMerge = !modeSel || modeSel.value!=='replace';
    if(doMerge && dash.rows && dash.rows.length){
      var m=mergeRowsByDate(dash.rows, rows, map);
      applyData(m.rows, map, fname, false,
        '补充导入成功：本次 '+fmtInt(rows.length)+' 行，累计 '+fmtInt(m.rows.length)+' 行（覆盖 '+m.coveredDates+' 个日期共 '+m.replaced+' 条，保留其它日期）');
    }else{
      applyData(rows, map, fname, false, (doMerge?'已导入 ':'覆盖导入完成：')+fmtInt(rows.length)+' 行');
    }
    if(miss&&miss.length) setStatus((doMerge?'补充导入成功；':'已导入 ')+fmtInt(rows.length)+' 行；未匹配到：'+miss.join(' / ')+'（相关表将部分为空）','ok');
    if(window.KpiCloudSync) window.KpiCloudSync.markDirty();
  }
  function loadFile(f){
    setStatus('正在解析 '+f.name+' …');
    var reader=new FileReader();
    reader.onload=function(e){
      var pr=parseArrayBuffer(e.target.result, f.name);
      if(!pr.ok){ setStatus(pr.msg,'err'); return; }
      importRows(pr.rows, pr.map, f.name, pr.miss);
    };
    reader.onerror=function(){ setStatus('读取失败：'+f.name,'err'); };
    reader.readAsArrayBuffer(f);
  }
  function loadFiles(files){
    if(files.length===1){ loadFile(files[0]); return; }
    setStatus('正在解析 '+files.length+' 个文件 …');
    var results=[], pending=files.length;
    files.forEach(function(f){
      var reader=new FileReader();
      reader.onload=function(e){
        results.push({f:f, pr:parseArrayBuffer(e.target.result, f.name)});
        if(--pending===0) finishMultiImport(results, files);
      };
      reader.onerror=function(){ results.push({f:f, pr:{ok:false,msg:'读取失败：'+f.name}}); if(--pending===0) finishMultiImport(results, files); };
      reader.readAsArrayBuffer(f);
    });
  }
  function finishMultiImport(results, files){
    var ok=results.filter(function(r){ return r.pr.ok; });
    var bad=results.filter(function(r){ return !r.pr.ok; });
    if(bad.length) setStatus('部分文件解析失败：'+bad.map(function(r){return r.pr.msg;}).join('； '),'err');
    if(!ok.length) return;
    var map=ok[0].pr.map, miss=ok[0].pr.miss, combined=[];
    ok.forEach(function(r){ combined=combined.concat(r.pr.rows); });
    importRows(combined, map, files.map(function(f){return f.name;}).join(' + '), miss);
  }

  /* ================= 表A：月度各科室业绩统计分析 ================= */
  /* 结构：部门 → 科室 → 医生；部门末出合计行；前台组仅 营销部/团检/其他 三行合计；全院合计行。
     业绩=收款金额-现款支付；容量=去重会员号（医生为跨科室合并去重，合计行各自重新去重，故≠相加）。 */
  function aggregateDept(rows,map){
    // 口径（2026-10-21 用户反馈修正）：各科室业绩以「订单所属-订单分诊医生」统计当月总现款支付，
    //   即一位医生的一行 = 该医生【当月全部订单】的现款支付合计 + 去重会员数（跨科室合并，科室行不重复计），
    //   展示时归到其金额最大的科室（主科室）；「订单开单科室」为口腔科的订单，业绩全部计入安志国。
    //   无分诊医生名的行（无/未归类/空）→ 按开单科室归入前台组（营销部/团检/其他）。
    //   守恒：部门组（医生行）+ 前台三行 = 全院合计。
    var docs={}, frontCash={}, frontMem={}, frontCons={}, totalCash=0, totalMem=new Set(), totalCons=0;
    var deptCash={}, deptMem={}, deptCons={};
    DEPT_ORDER.forEach(function(d){ deptCash[d]=0; deptMem[d]=new Set(); deptCons[d]=0; });
    FRONT_ROWS.forEach(function(f){ frontCash[f]=0; frontMem[f]=new Set(); });
    var idx={};   // 下钻桶：doc:医生 / front:前台键 / dept:部门 / all → 订单行号数组

    rows.forEach(function(r,i){
      var cash=num(r[map.cash]||0);
      var cons=rowCons(r,map);
      totalCash+=cash; totalCons+=cons;
      var mem=strVal(r[map.member]);
      var hasMem = (map.member!=null && isRealMember(mem));
      if(hasMem) totalMem.add(mem);
      var clinic=strVal(r[map.dept])||'未归类';
      var doctor=strVal(r[map.doctor])||'未归类';
      if(clinic==='口腔科') doctor=ORAL_DOCTOR;      // 口腔科全部归安志国
      var isDoc = doctor && doctor!=='无' && doctor!=='未归类';
      if(isDoc){
        var d=docs[doctor];
        if(!d){ d=docs[doctor]={cash:0,cons:0,mem:new Set(),clinics:{},primary:null,primaryCash:-1,deptPrimary:null,deptPrimaryCash:-1}; docs[doctor]=d; }
        d.cash+=cash; d.cons+=cons;
        if(hasMem) d.mem.add(mem);
        d.clinics[clinic]=(d.clinics[clinic]||0)+cash;
        if(cash>d.primaryCash){ d.primaryCash=cash; d.primary=clinic; }
        // 主科室优先取【科室类】中金额最大的（无科室/前台类不算医生归属科室），
        // 否则像「展婷」这类以 U=空 金额更大的医生会被错误挪进前台组
        if(DEPT_OF_CLINIC[clinic] && cash>d.deptPrimaryCash){ d.deptPrimaryCash=cash; d.deptPrimary=clinic; }
        (idx['doc:'+doctor]=idx['doc:'+doctor]||[]).push(i);
      }else{
        // 无分诊医生名 → 前台组按开单科室归集
        var fk=(clinic==='营销部'||clinic==='团检')?clinic:'其他';
        frontCash[fk]+=cash; frontCons[fk]=(frontCons[fk]||0)+cons;
        if(hasMem) frontMem[fk].add(mem);
        (idx['front:'+fk]=idx['front:'+fk]||[]).push(i);
      }
    });

    // 医生展示归属：名册优先（固定组织归属，与参考图一致）→ 否则主科室 → 否则前台「其他」
    // 归属科室（名册或主科室）决定进哪个部门；部门容量 = 该部门医生容量的并集
    var docClinicOf={};
    Object.keys(docs).forEach(function(name){
      var d=docs[name];
      docClinicOf[name] = ROSTER_CLINIC_OF[name] || d.deptPrimary || d.primary;
    });
    var frontDocCash={}, frontDocMem={}, frontDocCons={};
    FRONT_ROWS.forEach(function(f){ frontDocCash[f]=0; frontDocMem[f]=new Set(); frontDocCons[f]=0; });
    Object.keys(docs).forEach(function(name){
      var d=docs[name];
      var primary = docClinicOf[name];
      var dept=DEPT_OF_CLINIC[primary]||ROSTER_DEPT_OF[primary]||null;
      var di=idx['doc:'+name]||[];
      if(dept){
        deptCash[dept]+=d.cash; deptCons[dept]+=d.cons;
        d.mem.forEach(function(m){ deptMem[dept].add(m); });
        idx['dept:'+dept]=(idx['dept:'+dept]||[]).concat(di);
      }else{
        var fk=(primary==='营销部'||primary==='团检')?primary:'其他';
        frontDocCash[fk]+=d.cash; frontDocCons[fk]+=d.cons;
        d.mem.forEach(function(m){ frontDocMem[fk].add(m); });
        idx['front:'+fk]=(idx['front:'+fk]||[]).concat(di);
      }
    });

    var groups=[];
    DEPT_ORDER.forEach(function(dept){
      if(dept==='前台'){
        // 前台「其他」＝残差：全院合计−健管部合计−诊疗部合计−营销部−团检（2026-10-21 用户口径）
        var otherRes=totalCash-(deptCash['健管部']||0)-(deptCash['诊疗部']||0)
                    -(frontCash['营销部']+frontDocCash['营销部'])-(frontCash['团检']+frontDocCash['团检']);
        var otherResCons=totalCons-(deptCons['健管部']||0)-(deptCons['诊疗部']||0)
                    -(frontCons['营销部']+frontDocCons['营销部'])-(frontCons['团检']+frontDocCons['团检']);
        groups.push({dept:'前台',front:FRONT_ROWS.map(function(f){
          return {clinic:f,cash:(f==='其他')?otherRes:(frontCash[f]+frontDocCash[f]),
                  cons:(f==='其他')?otherResCons:(frontCons[f]+frontDocCons[f]),cap:0};
        })});
        return;
      }
      // 按名册固定结构输出：名册医生（含 0 元行）按名册顺序；名册外医生按主科室追加到对应科室末尾
      var byClinic={};
      var clinicOrder=[];
      (CLINIC_ROSTER[dept]||[]).forEach(function(pair){
        var clinic=pair[0];
        clinicOrder.push(clinic);
        byClinic[clinic]=[];
        pair[1].forEach(function(name){
          var d=docs[name];
          byClinic[clinic].push(d
            ? {name:name,cash:d.cash,cap:d.mem.size,cons:d.cons,roster:true}
            : {name:name,cash:0,cap:0,cons:0,roster:true});      // 名册内但当月无业绩 → 显示 0
        });
      });
      var extraByClinic={};
      Object.keys(docs).forEach(function(name){
        if(ROSTER_CLINIC_OF[name]) return;                  // 名册已收录
        var primary = docClinicOf[name];
        if(DEPT_OF_CLINIC[primary]!==dept && ROSTER_DEPT_OF[primary]!==dept) return;
        (extraByClinic[primary]=extraByClinic[primary]||[]).push({name:name,cash:docs[name].cash,cap:docs[name].mem.size,cons:docs[name].cons,roster:false});
      });
      Object.keys(extraByClinic).forEach(function(c){
        if(!byClinic[c]){ byClinic[c]=[]; clinicOrder.push(c); }
        byClinic[c]=byClinic[c].concat(extraByClinic[c].sort(function(a,b){ return b.cash-a.cash; }));
      });
      // 名册科室在 CLINIC_ORDER 中的位置优先，其余按数据出现顺序
      var ord=(CLINIC_ORDER[dept]||[]);
      var ordered=clinicOrder.slice().sort(function(x,y){
        var ix=ord.indexOf(x), iy=ord.indexOf(y);
        if(ix<0) ix=999; if(iy<0) iy=999;
        return ix-iy;
      });
      var clinics=ordered.map(function(c){
        return {clinic:c,label:CLINIC_LABEL[c]||c,docs:byClinic[c]||[]};
      });
      // 部门合计＝各明细行直加（业绩、容量、消耗业绩均相加；2026-10-21 用户口径：合计必须等于明细相加）
      var docCount=0, subCash=0, subCap=0, subCons=0;
      clinics.forEach(function(c){ docCount+=c.docs.length; c.docs.forEach(function(d){ subCash+=d.cash; subCap+=d.cap; subCons+=d.cons; }); });
      groups.push({
        dept:dept, clinics:clinics, docCount:docCount,
        subtotal:{cash:subCash,cap:subCap,cons:subCons}
      });
    });
    var deptCapSum=0; groups.forEach(function(g){ if(!g.front) deptCapSum+=g.subtotal.cap; });
    return {groups:groups, total:{cash:totalCash,cap:totalMem.size,cons:totalCons}, deptCapSum:deptCapSum, doctorCount:Object.keys(docs).length, idx:idx};
  }

  function renderDeptTable(a){
    var html='<thead><tr><th colspan="3" class="hd-l">科室</th><th>业绩（单位：元）</th><th>消耗业绩（元）</th><th>容量（单位：人）</th></tr></thead><tbody>';
    a.groups.forEach(function(g){

        +'<td class="num">'+fmt(g.subtotal.cash)+'</td><td class="num">'+fmt(g.subtotal.cons)+'</td><td class="num">'+fmtInt(g.subtotal.cap)+'</td></tr>';
    });
    html+='<tr class="total" data-drill="all" data-dlabel="全院合计"><td colspan="3" class="sum-lbl">全院合计</td>'
      +'<td class="num">'+fmt(a.total.cash)+'</td><td class="num">'+fmt(a.total.cons)+'</td><td class="num">'+fmtInt(a.total.cap)+'</td></tr>';
    html+='</tbody>';
    document.getElementById('tblDept').innerHTML=html;
  }

  /* ================= 表B：月度管家业绩统计分析（健康管家） ================= */
  function aggregateManager(rows,map){
    var mgr={}, totalCash=0, totalMem=new Set(), totalCons=0;
    var idx={};   // 下钻桶：mgr:咨询师 → 订单行号数组
    rows.forEach(function(r,i){
      var cash=num(r[map.cash]||0);
      var cons=rowCons(r,map);
      totalCash+=cash; totalCons+=cons;
      var mem=strVal(r[map.member]);
      if(map.member!=null && isRealMember(mem)) totalMem.add(mem);
      var name=strVal(r[map.consultant])||'无';
      if(map.consultant==null) name='（未匹配到开单咨询师列）';
      (idx['mgr:'+name]=idx['mgr:'+name]||[]).push(i);
      var m=mgr[name];
      if(!m){ m=mgr[name]={cash:0,cons:0,mem:new Set()}; mgr[name]=m; }
      m.cash+=cash; m.cons+=cons;
      if(map.member!=null && isRealMember(mem)) m.mem.add(mem);
    });
    var rowsOut=[];
    MANAGER_ROSTER.forEach(function(n){
      var m=mgr[n];
      rowsOut.push({name:n,cash:m?m.cash:0,cons:m?m.cons:0,kind:'roster'});
    });
    MGR_REFERENCE.forEach(function(n){
      var m=mgr[n];
      if(!m) return;
      rowsOut.push({name:n,cash:m.cash,cons:m.cons,kind:'ref'});
    });
    // 其余未在名册/参考/排除名单内的开单咨询师，按业绩降序补充展示（不计入管家合计）
    var extra=[];
    Object.keys(mgr).forEach(function(n){
      if(MANAGER_ROSTER.indexOf(n)>=0||MGR_REFERENCE.indexOf(n)>=0||MGR_EXCLUDE.indexOf(n)>=0) return;
      if(n==='无') return;
      extra.push({name:n,cash:mgr[n].cash,cons:mgr[n].cons,kind:'extra'});
    });
    extra.sort(function(x,y){ return y.cash-x.cash; });
    rowsOut=rowsOut.concat(extra);
    var rosterSum=0, rosterCons=0, refSum=0, refCons=0;
    rowsOut.forEach(function(r){ if(r.kind==='roster'){ rosterSum+=r.cash; rosterCons+=r.cons; } if(r.kind==='ref'){ refSum+=r.cash; refCons+=r.cons; } });
    var mgrSum=rosterSum+refSum, mgrCons=rosterCons+refCons;
    var mgrIdx=[];
    MANAGER_ROSTER.concat(MGR_REFERENCE).forEach(function(n){ mgrIdx=mgrIdx.concat(idx['mgr:'+n]||[]); });
    return {rows:rowsOut, rosterSum:rosterSum, rosterCons:rosterCons, mgrSum:mgrSum, mgrCons:mgrCons,
            none:mgr['无']?mgr['无'].cash:0, noneCons:mgr['无']?mgr['无'].cons:0,
            total:{cash:totalCash,cap:totalMem.size,cons:totalCons}, mgr:mgr, idx:idx, mgrIdx:mgrIdx};
  }

  function tgtStore(){ try{ return JSON.parse(localStorage.getItem(TGT_KEY))||{}; }catch(e){ return {}; } }
  function tgtGet(scope,name){
    var s=tgtStore(), b=s[scope]||{};
    var v=b[name];
    if(v==null||v==='') return (TGT_DEFAULT[name]!=null?TGT_DEFAULT[name]:0);
    var n=Number(v); return isNaN(n)?0:n;
  }
  function tgtSet(scope,name,v){
    var s=tgtStore();
    s[scope]=s[scope]||{};
    s[scope][name]=v;
    try{ localStorage.setItem(TGT_KEY,JSON.stringify(s)); }catch(e){}
  }
  function rateText(actual,target){
    if(!(target>0)) return {txt:'/',cls:''};
    var p=actual/target*100;
    return {txt:p.toFixed(1)+'%',cls:p>=100?'good':'bad'};
  }

  function renderManagerTable(b,monthLabel){

  /* ================= 月度业绩完成情况（按渠道归类 + 月度口径 + 年度合计） ================= */
  // 渠道归类（用户口径）：按「客户来源渠道分类（实时）」精确匹配——营销部/商务部，除此之外全部归入其他；
  // 旧表头无渠道分类列时，回退一级渠道关键字逻辑（营销部=含「营销部」；商务部=含「商务」/「商保」/「公司渠道」）
  function classifyChannel(r,map){
    if(map.channelCls!=null){
      var cls=strVal(r[map.channelCls]);
      if(cls==='营销部') return '营销部';
      if(cls==='商务部') return '商务部';
      return '其他（公司所有）';
    }
    var ch = map.channel!=null ? strVal(r[map.channel]) : '';
    if(ch.indexOf('营销部')>=0) return '营销部';
    if(ch.indexOf('商务')>=0 || ch.indexOf('商保')>=0 || ch.indexOf('公司渠道')>=0) return '商务部';
    return '其他（公司所有）';
  }
  function channelActuals(rows,map,months){
    months = months || (dash.months||[]);
    var byMonth={};
    rows.forEach(function(r){
      var m=rowMonth(r,map); if(!m) return;
      var ch=classifyChannel(r,map);
      var cash=num(r[map.cash]||0);
      if(!byMonth[m]) byMonth[m]={'营销部':0,'商务部':0,'其他（公司所有）':0};
      byMonth[m][ch]+=cash;
    });
    var annual={'营销部':0,'商务部':0,'其他（公司所有）':0};
    months.forEach(function(m){
      if(!byMonth[m]) return;
      ['营销部','商务部','其他（公司所有）'].forEach(function(k){ annual[k]+=byMonth[m][k]; });
    });
    return {byMonth:byMonth, annual:annual};
  }
  function channelSelMonth(){
    var s=activeMonths();
    return s.length ? s[s.length-1] : (dash.months.length?dash.months[dash.months.length-1]:'');
  }
  function renderChannelTable(){
    var map=dash.map; if(!map) return;
    var el=document.getElementById('tblChannel'); if(!el) return;
    var selMonth=channelSelMonth();
    var monthLabel = selMonth ? (parseInt(selMonth.slice(5),10)+'月') : '全部月份';
    var ca=channelActuals(dash.rows,map,activeMonths());
    var monthly = (selMonth && ca.byMonth[selMonth]) ? ca.byMonth[selMonth] : {'营销部':0,'商务部':0,'其他（公司所有）':0};
    var scope = selMonth || '__all__';
    var names=['营销部','商务部','其他（公司所有）'];
    var sumAct = monthly['营销部']+monthly['商务部']+monthly['其他（公司所有）'];
    // 2026-10-23：「其他（公司所有）」业绩目标改为自动推导 = 全院目标 − 营销部目标 − 商务部目标（不可编辑，保证合计目标=全院目标守恒）
    var mktTgt = tgtGet(scope,'营销部'), bizTgt = tgtGet(scope,'商务部');
    var hospTgt = tgtGet(scope,'全院目标');
    var othTgt = hospTgt - mktTgt - bizTgt;
    var tgtOf = function(n){ return n==='其他（公司所有）' ? othTgt : tgtGet(scope,n); };
    var sumTgt = mktTgt + bizTgt + othTgt;   // = 全院目标（口径守恒）
    var sumRt = rateText(sumAct,sumTgt);
    var hospRt = rateText(sumAct,hospTgt);
    var yearAct = ca.annual['营销部']+ca.annual['商务部']+ca.annual['其他（公司所有）'];
    var html='<thead>'
      +'<tr><th colspan="4" class="tl">月度业绩完成情况（'+escapeHtml(monthLabel)+'）'+(activeScope()==='__all__'?' · 按最新月份展示':'')+'</th></tr>'
      +'<tr><th class="tl">渠道</th><th>业绩目标（元）</th><th>实际完成（元）</th><th>完成率</th></tr></thead><tbody>';
    names.forEach(function(n){
      var act=monthly[n], tgt=tgtOf(n), rt=rateText(act,tgt);
      // 其他（公司所有）：目标为自动推导值，只读展示（不渲染输入框）
      var tgtCell = (n==='其他（公司所有）')
        ? '<td class="num" data-chtarget="其他（公司所有）" title="自动推导：全院目标 − 营销部目标 − 商务部目标（不可编辑）">'+fmt(tgt)+'</td>'
        : '<td class="tgt-cell"><input class="tgt-input" type="number" step="0.01" min="0" data-rbac="editTargets" data-chname="'+escapeHtml(n)+'" value="'+(tgt||'')+'" title="业绩目标（可手工编辑，按月保存）"></td>';
      html+='<tr><td class="doc">'+escapeHtml(n)+'</td>'+tgtCell
        +'<td class="num rate bad">'+fmt(act)+'</td>'
        +'<td class="num rate '+rt.cls+'" data-chrate-for="'+escapeHtml(n)+'">'+rt.txt+'</td></tr>';
    });
    html+='<tr class="ch-sum"><td class="doc">合计</td>'
      +'<td class="num" data-chtarget="__sum__">'+fmt(sumTgt)+'</td>'
      +'<td class="num">'+fmt(sumAct)+'</td>'
      +'<td class="num rate '+sumRt.cls+'" data-chrate-for="__sum__">'+sumRt.txt+'</td></tr>';
    html+='<tr class="hosp-target"><td class="doc">全院目标</td>'
      +'<td class="tgt-cell"><input class="tgt-input" type="number" step="0.01" min="0" data-rbac="editTargets" data-chname="全院目标" value="'+(hospTgt||'')+'" title="全院目标（可手工编辑，默认 300 万）"></td>'
      +'<td class="num">'+fmt(sumAct)+'</td>'
      +'<td class="num rate '+hospRt.cls+'" data-chrate-for="全院目标">'+hospRt.txt+'</td></tr>';
    html+='<tr class="year-total"><td class="doc">年度合计（'+activeMonths().length+' 个月）</td>'
      +'<td class="num dim">—</td>'
      +'<td class="num">'+fmt(yearAct)+'</td>'
      +'<td class="num dim">/</td></tr>';
    html+='</tbody>';
    el.innerHTML=html;
    el.querySelectorAll('.tgt-input').forEach(function(inp){
      inp.addEventListener('input',function(){
        var name=inp.dataset.chname, v=parseFloat(inp.value);
        tgtSet(scope,name,isNaN(v)?0:v);
        refreshChannelRates();
        if(window.KpiCloudSync) window.KpiCloudSync.markDirty();
      });
    });
    document.getElementById('chTag').textContent = activeScope()==='__all__' ? '全部月份（按最新月 '+monthLabel+'）' : activeScope();
    var note='口径：渠道按「客户来源渠道分类（实时）」精确归类——渠道分类=营销部 → 营销部；渠道分类=商务部 → 商务部；除此之外（公司所有/经营科室/推荐/市场部/空值等）→ 其他（公司所有）；合计=三项直加（=全院，口径守恒）。'
      +'实际完成＝该渠道名下「收款金额-现款支付」合计（与表B 实际完成列一致）。营销部/商务部/全院目标可手工编辑，按月份分别保存并同步云端；'
      +'其他（公司所有）业绩目标＝全院目标−营销部目标−商务部目标（自动推导，不可编辑，故合计目标恒等于全院目标）；'
      +'完成率＝实际完成 ÷ 业绩目标（目标≤0 显示「/」）。';
    if(map.channelCls==null && map.channel==null) note+='（未匹配到渠道列，全部归入「其他（公司所有）」）';
    note+='「年度合计」行为跨全部月份求和的真实累计，无年度目标故完成率显示「/」。点击「导出」可生成与页面样式完全一致的 Excel。';
    document.getElementById('chNote').textContent=note;
  }
  function refreshChannelRates(){
    var map=dash.map; if(!map) return;
    var selMonth=channelSelMonth();
    var scope=selMonth||'__all__';
    var ca=channelActuals(dash.rows,map,activeMonths());
    var monthly=(selMonth && ca.byMonth[selMonth]) ? ca.byMonth[selMonth] : {'营销部':0,'商务部':0,'其他（公司所有）':0};
    var tbl=document.getElementById('tblChannel'); if(!tbl) return;
    // 与 renderChannelTable 一致的推导：其他（公司所有）目标 = 全院目标 − 营销部目标 − 商务部目标（自动推导，保证合计目标守恒）
    var mktTgt=tgtGet(scope,'营销部'), bizTgt=tgtGet(scope,'商务部'), hospTgt=tgtGet(scope,'全院目标');
    var othTgt=hospTgt-mktTgt-bizTgt;
    var tgtOf=function(n){ return n==='其他（公司所有）'?othTgt:tgtGet(scope,n); };
    ['营销部','商务部','其他（公司所有）'].forEach(function(n){
      var rt=rateText(monthly[n],tgtOf(n));
      var c=tbl.querySelector('[data-chrate-for="'+cssEsc(n)+'"]');
      if(c){ c.textContent=rt.txt; c.className='num rate '+rt.cls; }
    });
    var sumAct=monthly['营销部']+monthly['商务部']+monthly['其他（公司所有）'];
    var sumTgt=mktTgt+bizTgt+othTgt;   // = 全院目标（口径守恒）
    var st=tbl.querySelector('[data-chtarget="__sum__"]');
    if(st){ st.textContent = sumTgt?fmt(sumTgt):'0'; }
    // 其他（公司所有）目标随全院/营销部/商务部变动而自动重算（只读展示）
    var oc=tbl.querySelector('[data-chtarget="其他（公司所有）"]');
    if(oc){ oc.textContent = othTgt?fmt(othTgt):'0'; }
    var sc=tbl.querySelector('[data-chrate-for="__sum__"]');
    if(sc){ var srt=rateText(sumAct,sumTgt); sc.textContent=srt.txt; sc.className='num rate '+srt.cls; }
    var hc=tbl.querySelector('[data-chrate-for="全院目标"]');
    if(hc){ var hrt=rateText(sumAct,tgtGet(scope,'全院目标')); hc.textContent=hrt.txt; hc.className='num rate '+hrt.cls; }
  }

  /* ================= 导出（样式与页面完全一致：藏蓝表头/合并单元格/黑框/斑马行/合计配色） ================= */
  // 页面配色 → 导出样式键：表头 navy#002060白粗，部门列 #d6e0f0，科室列 #f3f6fb，
  // 斑马偶数行 #fbfcfe，部门合计 #D7EFF9，全院合计 #d6e0f0，参考行 #f7f7f7 斜体灰，全部黑色细框线。
  function buildDeptStyled(a){
    var rows=[], merges=[];
    function M(r,c,r2,c2){ if(!(r===r2&&c===c2)) merges.push({r:r,c:c,r2:r2,c2:c2}); }
    function C(v,t,s){ return {v:v,t:t,s:s}; }
    // 表头（页面：thead th 藏蓝底白字加粗居中）
    rows.push([C('科室','s','title'),C('','s','title'),C('','s','title'),
               C('业绩（单位：元）','s','title'),C('消耗业绩（元）','s','title'),C('容量（单位：人）','s','title')]);
    M(0,0,0,2);
    var tr=0;   // tbody 行计数（页面斑马样式 tbody tr:nth-child(even) 只作用于名称列）
    a.groups.forEach(function(g){
      var r0=rows.length;
      if(g.front){
        g.front.forEach(function(fr,i){
          tr++;
          var z=(tr%2===0);
          rows.push([
            i===0?C(g.dept,'s','dept'):null,
            C(fr.clinic,'s','clinic'),
            C('合计','s',z?'docZ':'doc'),
            C(fr.cash,'n','num'),
            C(fr.cons,'n','num'),
            C('/','s','dim')
          ]);
        });
        M(r0,0,rows.length-1,0);
        return;
      }
      g.clinics.forEach(function(c){
        var cr0=rows.length;
        c.docs.forEach(function(d,di){
          tr++;
          var z=(tr%2===0);
          rows.push([
            di===0?C(g.dept,'s','dept'):null,   // 部门名写在合并区锚点（首行首列），修复旧版标签丢失
            di===0?C(c.label,'s','clinic'):null,
            C(d.name,'s',z?'docZ':'doc'),
            C(d.cash,'n','num'),
            C(d.cons,'n','num'),
            C(d.cap,'n','numInt')
          ]);
        });
        M(cr0,1,rows.length-1,1);
      });
    tr++;
    // 与页面几何一致：部门名 rowspan 覆盖合计行第1列，合计标签合并第2~3列，数值落在业绩/消耗/容量列
    rows.push([
      null,C(g.dept+'合计','s','sumL'),null,
      C(g.subtotal.cash,'n','sumN'),C(g.subtotal.cons,'n','sumN'),C(g.subtotal.cap,'n','sumNInt')
    ]);
    M(rows.length-1,1,rows.length-1,2);
    M(r0,0,rows.length-1,0);   // 部门纵向合并含合计行（同页面 rowspan=docCount+1）
    });
    tr++;
    rows.push([
      C('全院合计','s','totL'),null,null,
      C(a.total.cash,'n','totN'),C(a.total.cons,'n','totN'),C(a.total.cap,'n','totNInt')
    ]);
    M(rows.length-1,0,rows.length-1,2);
    return {rows:rows,merges:merges,colWidths:[10,14,14,18,16,16],sheetName:'各科室业绩统计',freezeRows:1};
  }

  function buildMgrStyled(b,monthLabel){
    var scope=activeScope();
    var rows=[], merges=[];
    function M(r,c,r2,c2){ if(!(r===r2&&c===c2)) merges.push({r:r,c:c,r2:r2,c2:c2}); }
    function C(v,t,s){ return {v:v,t:t,s:s}; }
    function rateCell(v,t){ return (t>0)?C(v/t,'n','pct'):C('/','s','pctDim'); }
    // 表头一行（2026-10-23：与页面一致，去掉月份行，藏蓝底白字）
    rows.push([C('健康管家','s','title'),C('月业绩目标','s','title'),C('实际完成','s','title'),C('消耗业绩（元）','s','title'),C('月完成率','s','title')]);
    b.rows.forEach(function(r){
      var t=tgtGet(scope,r.name);
      rows.push([C(r.name,'s','doc'),C(t||0,'n','plain'),C(r.cash,'n','num'),C(r.cons,'n','num'),rateCell(r.cash,t)]);

    var allTgt=tgtGet(scope,'全院合计');

  function buildChannelStyled(){
    var map=dash.map;
    var selMonth=channelSelMonth();
    var monthLabel = selMonth ? (parseInt(selMonth.slice(5),10)+'月') : '全部月份';
    var ca=channelActuals(dash.rows,map,activeMonths());
    var monthly=(selMonth && ca.byMonth[selMonth]) ? ca.byMonth[selMonth] : {'营销部':0,'商务部':0,'其他（公司所有）':0};
    var scope=selMonth||'__all__';
    var rows=[], merges=[];
    function M(r,c,r2,c2){ if(!(r===r2&&c===c2)) merges.push({r:r,c:c,r2:r2,c2:c2}); }
    function C(v,t,s){ return {v:v,t:t,s:s}; }
    // 藏蓝表头白字（与表A/表B 完全一致）
    rows.push([C('月度业绩完成情况（'+monthLabel+'）','s','title'),C('','s','title'),C('','s','title'),C('','s','title')]);
    M(0,0,0,3);
    rows.push([C('渠道','s','title'),C('业绩目标（元）','s','title'),C('实际完成（元）','s','title'),C('完成率','s','title')]);
    var names=['营销部','商务部','其他（公司所有）'];
    // 其他（公司所有）目标 = 全院目标 − 营销部目标 − 商务部目标（自动推导，与页面一致，保证合计目标守恒）
    var mktTgt=tgtGet(scope,'营销部'), bizTgt=tgtGet(scope,'商务部'), hospTgt=tgtGet(scope,'全院目标');
    var othTgt=hospTgt-mktTgt-bizTgt;
    var tgtOf=function(n){ return n==='其他（公司所有）'?othTgt:tgtGet(scope,n); };
    names.forEach(function(n){
      var act=monthly[n], t=tgtOf(n);
      rows.push([C(n,'s','doc'),C(t||0,'n','plain'),C(act,'n','num'),(t>0?C(act/t,'n','pct'):C('/','s','pctDim'))]);
    });
    var sumAct=monthly['营销部']+monthly['商务部']+monthly['其他（公司所有）'];
    var sumTgt=mktTgt+bizTgt+othTgt;   // = 全院目标（口径守恒）
    rows.push([C('合计','s','sumL'),C(sumTgt||0,'n','sumN'),C(sumAct,'n','sumN'),(sumTgt>0?C(sumAct/sumTgt,'n','sumPct'):C('/','s','pctDim'))]);
    rows.push([C('全院目标','s','totDoc'),C(hospTgt||0,'n','totPlain'),C(sumAct,'n','totN'),(hospTgt>0?C(sumAct/hospTgt,'n','totPct'):C('/','s','totPctDim'))]);
    var yearAct=ca.annual['营销部']+ca.annual['商务部']+ca.annual['其他（公司所有）'];
    rows.push([C('年度合计（'+activeMonths().length+' 个月）','s','totDoc'),C('/','s','totPlain'),C(yearAct,'n','totN'),C('/','s','totPctDim')]);
    return {rows:rows,merges:merges,colWidths:[20,16,18,12],sheetName:'月度业绩完成情况',freezeRows:2};
  }

  document.getElementById('btnXlsxDept').addEventListener('click',function(){ exportTable('dept'); });
  document.getElementById('btnXlsxMgr').addEventListener('click',function(){ exportTable('mgr'); });
  document.getElementById('btnXlsxChannel').addEventListener('click',function(){ exportTable('channel'); });

  /* ---------- 明细下钻：点击统计表任意行（含合计行）查看对应订单 ---------- */
  function drillDate(r,map){
    var d=rowDateKey(r,map); if(d) return d;
    var v=(map.ym!=null)?r[map.ym]:((map.date!=null)?r[map.date]:'');
    return String(v==null?'':v);
  }
  function openDrill(key,label){
    if(!dash.rows||!dash.rows.length||!dash.map) return;
    var inScope = activeScope()==='__all__' ? dash.rows : dash.rows.filter(function(r){ return rowMonth(r,dash.map)===activeScope(); });
    var idxs=null;
    if(key==='all'){ idxs=inScope.map(function(_,i){ return i; }); }
    else if(key==='mgrsum'){ idxs=(dash.aggB&&dash.aggB.mgrIdx)||null; }
    else if(dash.aggA&&dash.aggA.idx&&dash.aggA.idx[key]) idxs=dash.aggA.idx[key];
    else if(dash.aggB&&dash.aggB.idx&&dash.aggB.idx[key]) idxs=dash.aggB.idx[key];
    if(!idxs) idxs=[];
    var map=dash.map;
    // 预构建明细数组（含 会员姓名 / 消耗金额），供筛选与合计行实时重算
    var rowsData=idxs.map(function(i){
      var r=inScope[i]; if(!r) return null;
      var cash=num(r[map.cash]||0);
      var cons=rowCons(r,map);
      return {
        date: drillDate(r,map),
        dept: map.dept!=null?strVal(r[map.dept]):'',
        doctor: map.doctor!=null?strVal(r[map.doctor]):'',
        consultant: map.consultant!=null?strVal(r[map.consultant]):'',
        member: map.member!=null?strVal(r[map.member]):'',
        mname: map.mname!=null?strVal(r[map.mname]):'',
        cash: cash, cons: cons
      };
    }).filter(Boolean);
    dash.drillRows=rowsData;
    dash.drillLabel=label;
    document.getElementById('drillTitle').textContent='明细下钻 · '+label;
    var f=document.getElementById('drillFilter'); if(f) f.value='';
    renderDrill();
    document.getElementById('drillMask').style.display='flex';
  }
  function renderDrill(){
    var rowsData=dash.drillRows||[], map=dash.map;
    if(!map) return;
    var f=(document.getElementById('drillFilter').value||'').trim().toLowerCase();
    var filtered = f ? rowsData.filter(function(o){
      return (o.date+' '+o.dept+' '+o.doctor+' '+o.consultant+' '+o.member+' '+o.mname).toLowerCase().indexOf(f)>=0;
    }) : rowsData;
    var sumCash=0, sumCons=0;
    var body=filtered.map(function(o){
      sumCash+=o.cash; sumCons+=o.cons;
      return '<tr>'
        +'<td class="doc">'+escapeHtml(o.date)+'</td>'
        +'<td class="doc">'+escapeHtml(o.dept)+'</td>'
        +'<td class="doc">'+escapeHtml(o.doctor)+'</td>'
        +'<td class="doc">'+escapeHtml(o.consultant)+'</td>'
        +'<td class="doc">'+escapeHtml(o.member)+'</td>'
        +'<td class="doc">'+escapeHtml(o.mname)+'</td>'
        +'<td class="num">'+fmt(o.cash)+'</td>'
        +'<td class="num">'+fmt(o.cons)+'</td></tr>';
    }).join('');
    var allCash=0, allCons=0; rowsData.forEach(function(o){ allCash+=o.cash; allCons+=o.cons; });
    document.getElementById('drillMeta').textContent=
      fmtInt(rowsData.length)+' 笔订单 · 现款支付合计 ¥'+fmt(allCash)
      + (f?(' · 已筛选 '+filtered.length+' 笔'):'')
      + ' · 消耗金额合计 ¥'+fmt(allCons);
    document.getElementById('drillTbl').innerHTML=
      '<thead><tr><th>日期</th><th>开单科室</th><th>分诊医生</th><th>开单咨询师</th><th>会员号</th><th>会员姓名</th><th>现款支付（元）</th><th>消耗金额（元）</th></tr></thead><tbody>'
      +(body||'<tr><td colspan="8" style="text-align:center;padding:24px 0;color:var(--ink-soft);">没有对应订单。</td></tr>')
      +'<tr class="drill-sum"><td colspan="6" class="sum-lbl">合计（'+fmtInt(filtered.length)+' 笔）</td>'
        +'<td class="num">'+fmt(sumCash)+'</td>'
        +'<td class="num">'+fmt(sumCons)+'</td></tr>'
      +'</tbody>';
  }
  function closeDrill(){ document.getElementById('drillMask').style.display='none'; }
  ['tblDept','tblMgr'].forEach(function(id){
    document.getElementById(id).addEventListener('click',function(e){
      if(e.target.tagName==='INPUT') return;                 // 目标输入框不触发下钻
      var tr=e.target.closest('tr[data-drill]');
      if(tr) openDrill(tr.getAttribute('data-drill'), tr.getAttribute('data-dlabel')||'');
    });
  });
  document.getElementById('drillClose').addEventListener('click',closeDrill);
  document.getElementById('drillMask').addEventListener('click',function(e){ if(e.target===this) closeDrill(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDrill(); });
  document.getElementById('drillFilter').addEventListener('input',renderDrill);

  /* ---------- 云端持久化（WorkBuddy Cloud Service，按账号隔离） ----------
   * 目的：导入的明细与聚合结果不随浏览器/设备丢失。整包 JSONB 快照存 dp_monthly，
   * 每账号一行（owner_id 由服务端 auth.uid() 填充 + RLS 隔离），未登录时不影响本机使用。 */
  /* 后端已迁至腾讯云 CloudBase：环境/密钥由 shared/cloudbase-bridge.js (window.CB) 提供 */
  var KPI_TS_KEY = 'kpi_cloud_ts_monthly';
  function dashPayload(){
    if(!dash.rows || !dash.rows.length || !dash.map) return null;
    // 注意：selMonths（月份多选浮层）是临时 UI 状态，不应随云端快照恢复——
    // 否则会覆盖本机当前的月份筛选，导致下钻口径/目标保存键位错乱。云端只存数据与目标。
    return { rows: dash.rows, map: dash.map, fname: dash.fname || '', scope: activeScope() || '__all__', targets: tgtStore(), ts: Date.now() };
  }
  function applyDashPayload(p){
    if(!p || !Array.isArray(p.rows) || !p.rows.length || !p.map) return;
    var map=p.map;
    if(typeof map==='string'){ try{ map=JSON.parse(map); }catch(e){} }
    if(!map || typeof map!=='object') return;
    // 旧快照的 map 可能是旧表头键 → 用当前表头重算一次，失败再回退旧 map
    try{
      var fresh=resolveHeaders(Object.keys(p.rows[0]||{}));
      if(fresh.cash!=null && (fresh.ym!=null||fresh.date!=null)) map=fresh;
    }catch(e){}
    if(map.cash==null) return;
    if(p.targets && typeof p.targets==='object'){
      try{
        var s=tgtStore();
        Object.keys(p.targets).forEach(function(k){ if(!s[k] || !Object.keys(s[k]||{}).length) s[k]=p.targets[k]; });
        localStorage.setItem(TGT_KEY,JSON.stringify(s));
      }catch(e){}
    }
    applyData(p.rows, map, p.fname || '云端数据', true);
    // 不恢复 selMonths / scope：月份筛选是临时 UI 状态，保持「全部月份」(applyData 已重置)
    renderMonthPop();
    renderDashboard();
  }
  function startCloudSync(){
    if(!window.KpiCloudSync) return;
    window.KpiCloudSync.start({
      table: 'dp_monthly',
      tsKey: KPI_TS_KEY,
      collect: dashPayload,
      apply: applyDashPayload,
      isEmpty: function(p){ return !(p && Array.isArray(p.rows) && p.rows.length); },
      countOf: function(p){ return (p && Array.isArray(p.rows)) ? p.rows.length : 0; }
    });
  }
  /* 暴露给外部脚本：月份多选浮层 / 清空数据按钮（独立 <script> 块） */
  window.dash=dash; window.setStatus=setStatus; window.renderDashboard=renderDashboard; window.renderMonthPop=renderMonthPop; window.TGT_KEY=TGT_KEY;
  window.clearLocalDash=clearLocalDash; window.saveLocalDash=saveLocalDash; window.saveLocalUI=saveLocalUI;
  window.__maLoadLocal=loadLocalDash; window.__maSaveNow=function(){ doSaveLocalDash(false); };

  /* 徽章：点击立即重写并校验，用户可自查「到底存住了没有」 */
  (function bindSaveChip(){
    var el=document.getElementById('saveChip');
    if(!el) return;
    var run=function(){ doSaveLocalDash(true); };
    el.addEventListener('click',run);
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); run(); }
    });
  })();
  (function bindLoadCache(){
    var btn=document.getElementById('btnLoadCache');
    if(!btn) return;
    btn.addEventListener('click',function(){
      btn.disabled=true;
      loadLocalDash().then(function(ok){
        btn.disabled=false;
        if(!ok) setStatus('本机没有可用的缓存（可能已被清理，或换过浏览器/设备）。请重新导入 Excel。','err');
        else setStatus('已从本机缓存载入 '+fmtInt((dash.rows||[]).length)+' 行。','ok');
      });
    });
  })();
  /* 卸载 / 切后台时补写待落盘的数据：导入后立刻刷新也不会丢 */
  window.addEventListener('pagehide',flushLocalDash);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden') flushLocalDash();
  });
  /* 申请持久化存储：降低空间紧张时浏览器回收 IndexedDB 的概率（被拒也不影响功能） */
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
  /* 存储可用性探测：无痕/受限模式下 IndexedDB 直接失败，必须当场说清楚，
     否则用户会以为「导入成功但刷新就丢」是系统 bug */
  (function probeStorage(){
    ldOpen().then(function(db){ try{ db.close(); }catch(e){} },function(){
      if(ldState.status==='saved') return;
      ldState={status:'error',ts:0,n:0,msg:'浏览器数据库不可用'};
      paintChip();
      setStatus('⚠️ 当前浏览器无法使用本机数据库（常见于无痕 / 受限模式或禁用了网站数据），数据只存在内存里，刷新会丢。请用普通窗口打开，或先用「💾 备份」导出备份文件。','err');
    });
  })();
  paintChip();

  /* 页面打开先读本机缓存，再启动云端对齐 —— 顺序不能颠倒：
     kpi-cloud-sync 的首次对齐会先 collect()，本机若还没恢复就会判成「本地为空」，
     直接 adopt 云端快照；万一云端是旧的，就把本机刚导入/刚恢复的数据盖掉了。 */
  loadLocalDash().then(startCloudSync, startCloudSync);
})();
</script>

<script>
/* 月份多选浮层（替代旧 chips：复选框多选取并集，「全部」= 清空筛选） */
(function(){
  var btn=document.getElementById('monthBtn');
  var pop=document.getElementById('monthPop');
  var catsBox=document.getElementById('monthCats');
  if(!btn||!pop||!catsBox) return;
  var allCb=pop.querySelector('.pf-cb[data-v="__all__"]');
  function syncLabel(){
    var sel=(window.dash&&window.dash.selMonths)||[];
    btn.textContent = !sel.length ? '全部月份' : (sel.length===1 ? sel[0] : '已选 '+sel.length+' 个月');
    if(allCb) allCb.checked = (sel.length===0);
  }
  function applyChecks(){
    var sel=(window.dash&&window.dash.selMonths)||[];
    pop.querySelectorAll('.pf-cb[data-v]').forEach(function(cb){
      var v=cb.getAttribute('data-v');
      cb.checked = (v==='__all__') ? (sel.length===0) : (sel.indexOf(v)>=0);
    });
  }
  // 供本机缓存恢复后回填 UI（恢复晚于本脚本执行，syncLabel 需要被重新调用一次）
  window.__maSyncMonthUI=function(){ syncLabel(); applyChecks(); };
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = pop.style.display!=='none';
    document.querySelectorAll('.proj-filter-pop').forEach(function(p){ p.style.display='none'; });
    pop.style.display = open ? 'none' : 'block';
    if(!open) applyChecks();
  });
  pop.addEventListener('click', function(e){ e.stopPropagation(); });
  pop.addEventListener('change', function(e){
    var cb=e.target.closest('.pf-cb'); if(!cb) return;
    var v=cb.getAttribute('data-v');
    var sel=((window.dash&&window.dash.selMonths)||[]).filter(function(x){ return x!=='__all__'; });
    if(v==='__all__'){ sel=[]; }
    else if(cb.checked){ if(sel.indexOf(v)<0) sel.push(v); }
    else { sel=sel.filter(function(x){ return x!==v; }); }
    window.dash.selMonths=sel;
    window.dash.scope = sel.length ? sel[sel.length-1] : '__all__';
    syncLabel(); applyChecks();
    if(window.saveLocalUI) window.saveLocalUI();   // 月份筛选也记住，刷新后保持上次选择
    if(window.renderDashboard) window.renderDashboard();
  });
  syncLabel();
})();
</script>
<script>
/* 筛选段折叠（shared/filterbar.css）：⚙筛选 胶囊切换 fbody 显隐，状态按面板持久化 */
(function(){
  function applyBtn(b){
    var key='ma_fbar_'+(b.getAttribute('data-fbar')||'x');
    var bar=b.closest('.fbar');
    var collapsed=false;
    try{ collapsed=localStorage.getItem(key)==='1'; }catch(e){}
    if(bar) bar.classList.toggle('collapsed',collapsed);
    var caret=b.querySelector('.ft-caret');
    if(caret) caret.textContent=collapsed?'▸':'▴';
  }
  document.querySelectorAll('.ftoggle[data-fbar]').forEach(function(b){
    applyBtn(b);
    b.addEventListener('click',function(){
      var key='ma_fbar_'+(b.getAttribute('data-fbar')||'x');
      var bar=b.closest('.fbar');
      var collapsed=bar?bar.classList.toggle('collapsed'):false;
      try{ localStorage.setItem(key,collapsed?'1':'0'); }catch(e){}
      var caret=b.querySelector('.ft-caret');
      if(caret) caret.textContent=collapsed?'▸':'▴';
    });
  });
})();
</script>
<script>
/* 清空数据（双重确认） */
(function(){
  var btn=document.getElementById('btnClearData');
  if(!btn) return;
  btn.addEventListener('click',function(){
    var d=window.dash;
    if(!d||!d.rows||!d.rows.length){ if(window.setStatus) window.setStatus('当前没有可清空的数据。','err'); return; }
    if(!window.confirm('确认清空已导入的全部数据？此操作不可撤销，需重新导入。')) return;
    if(!window.confirm('再次确认：将清空所有已导入明细与业绩目标，确定继续？')) return;
    d.rows=[]; d.map=null; d.fname=''; d.scope='__all__'; d.selMonths=[]; d.months=[];
    try{ localStorage.removeItem(window.TGT_KEY); }catch(e){}
    // 本机缓存一并清掉，否则刷新后又被读回来 —— 用户明确点过「清空」，这就是唯一的删除入口
    try{ if(window.clearLocalDash) window.clearLocalDash(); }catch(e){}
    var fm=document.getElementById('fMeta'); if(fm) fm.textContent='未导入';
    var mc=document.getElementById('monthCats'); if(mc) mc.innerHTML='';
    var tb=document.getElementById('tables'); if(tb) tb.style.display='none';
    var kp=document.getElementById('kpis'); if(kp) kp.style.display='none';
    var ph=document.getElementById('placeholder'); if(ph) ph.style.display='block';
    if(window.setStatus) window.setStatus('已清空全部数据。','ok');
    if(window.renderMonthPop) window.renderMonthPop();
    if(window.KpiCloudSync) window.KpiCloudSync.markDirty();
  });
})();
</script>
