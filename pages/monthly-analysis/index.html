<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月度分析面板</title>
<style>
  :root{
    /* 藏蓝主题色板（与数据统计平台统一） */
    --navy:#002060;
    --navy-900:#003366;
    --navy-700:#0a4ea3;
    --navy-100:#d6e0f0;
    --navy-50:#f3f6fb;
    --light-blue:#D7EFF9;
    --ink:#0f172a;
    --ink-soft:#5b6472;
    --line:#000000;
    --up:#c0392b;      /* 上涨/注意=红（中式习惯） */
    --down:#0a7d3b;    /* 下降/达标=绿 */
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:var(--font);color:var(--ink);
    background:linear-gradient(170deg,#eef3fa 0%,#e2ebf6 60%,#dbe7f4 100%);
    font-size:14px;line-height:1.5;min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:16px 20px 40px;}

  /* ===== 顶栏：标题 + 月份切换 ===== */
  .topbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:2px 0 12px;margin-bottom:14px;border-bottom:2px solid var(--navy);
  }
  .topbar h1{font-size:20px;margin:0;color:var(--navy-900);letter-spacing:.5px;}
  .topbar .sub{color:var(--ink-soft);font-size:12.5px;flex:1;min-width:200px;}
  .month-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--navy-100);background:#fff;color:var(--navy);
    border-radius:999px;padding:4px 14px;font-size:12.5px;font-family:inherit;
    cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap;
  }
  .chip:hover{border-color:var(--navy-700);background:var(--navy-50);}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(1,65,139,.25);}

  /* ===== 导入区 ===== */
  .import-card{
    background:#fff;border:1px solid var(--navy-100);border-radius:10px;
    padding:16px 18px;margin-bottom:18px;transition:.2s;
  }
  .import-card.mini{
    padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;
  }
  .import-card.mini .drop{display:none;}
  .import-card.mini .schema{display:none;}
  .import-card.mini .mini-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;}
  .mini-bar .ficon{font-size:16px;}
  .mini-bar .fname{font-weight:600;color:var(--navy-900);}
  .mini-bar .fmeta{color:var(--ink-soft);}
  .mini-bar .reimport{
    margin-left:auto;border:1px solid var(--navy-100);background:var(--navy-50);color:var(--navy);
    border-radius:7px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer;
  }
  .mini-bar .reimport:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .drop{
    border:2px dashed var(--navy-100);border-radius:10px;background:var(--navy-50);
    padding:22px;text-align:center;cursor:pointer;transition:.15s;
  }
  .drop:hover,.drop.drag{border-color:var(--navy-700);background:var(--light-blue);}
  .drop b{color:var(--navy);}
  .drop .hint{color:var(--ink-soft);font-size:12px;margin-top:6px;}
  .schema{margin-top:10px;font-size:12px;color:var(--ink-soft);}
  .schema code{background:var(--navy-50);padding:1px 6px;border-radius:4px;color:var(--navy-900);}
  #file{display:none;}
  .status{margin-top:10px;font-size:12.5px;min-height:18px;}
  .import-card.mini .status{margin:0;min-height:0;flex-basis:100%;}
  .status.ok{color:#0a7d3b;}
  .status.err{color:#c0392b;}

  /* ===== 表卡壳 ===== */
  .card{background:#fff;border:1px solid var(--navy-100);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(1,65,139,.06);margin-bottom:16px;}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--navy-900);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card h3 .t{display:flex;align-items:center;}
  .card h3 .bar{display:inline-block;width:4px;height:14px;background:var(--navy);border-radius:2px;margin-right:8px;vertical-align:-2px;}
  .card h3 .tag{font-size:11px;color:var(--ink-soft);font-weight:400;}
  .tbl-ops{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--navy-100);background:var(--navy-50);color:var(--navy);
    border-radius:7px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .table-card{overflow:auto;border-radius:8px;}
  .mt-note{margin-top:8px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;}

  /* ===== 统计表（按用户参考图版式） ===== */
  table.mt{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:640px;}
  table.mt th,table.mt td{border:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap;}
  table.mt thead th{background:var(--navy);color:#fff;font-weight:600;text-align:center;position:sticky;top:0;z-index:1;}
  table.mt td.dept{background:var(--navy-100);color:var(--navy-900);font-weight:700;text-align:center;vertical-align:middle;}
  table.mt td.clinic{background:var(--navy-50);color:var(--navy-900);font-weight:600;text-align:center;}
  table.mt td.doc,table.mt td.doc-lbl{text-align:left;background:#fff;color:var(--ink);}
  table.mt tbody tr:nth-child(even) td.doc,
  table.mt tbody tr:nth-child(even) td.doc-lbl{background:#fbfcfe;}
  table.mt td.num{text-align:right;}
  table.mt td.dim{color:var(--ink-soft);}
  table.mt tr.sum td{background:var(--light-blue);font-weight:700;}
  table.mt tr.sum td.sum-lbl{text-align:center;}
  table.mt tr.total td{background:var(--navy-100);font-weight:700;}
  table.mt tr.total td.sum-lbl{text-align:center;}
  table.mt td.ref-name{color:var(--ink-soft);}
  table.mt tr.ref-row td{background:#f7f7f7;color:var(--ink-soft);font-style:italic;}
  table.mt tr.wu-row td.doc{color:var(--ink-soft);}
  .ref-mark{display:inline-block;margin-left:5px;padding:0 5px;font-size:10px;font-style:normal;line-height:15px;border-radius:3px;background:#eceff3;color:var(--ink-soft);border:1px solid #dfe3e8;vertical-align:1px;}

  /* 目标输入框 */
  .tgt-input{
    width:110px;height:26px;padding:0 8px;text-align:right;font-family:inherit;font-size:12.5px;
    border:1px solid var(--navy-100);border-radius:5px;background:#fff;color:var(--ink);
  }
  .tgt-input:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 2px rgba(10,78,163,.15);}
  .tgt-input:disabled{background:#f4f5f7;color:var(--ink-soft);cursor:not-allowed;}
  td.tgt-cell{text-align:center;}
  .rate{font-weight:600;}
  .rate.good{color:var(--down);}
  .rate.bad{color:var(--up);}

  .empty{color:var(--ink-soft);text-align:center;padding:60px 0;font-size:14px;}
  @media(max-width:640px){
    table.mt{min-width:560px;}
    .tgt-input{width:92px;}
    .tbl-ops{width:100%;}
  }
</style>

<body>
<div class="wrap">
  <div class="topbar">
    <h1>月度分析面板</h1>
    <span class="sub">科室业绩 / 健康管家业绩双表分析 · 支持单月聚焦</span>
    <span class="month-chips" id="chips" style="display:none;"></span>
  </div>

  <div class="import-card" id="importCard">
    <div class="drop" id="drop">
      <div><b>点击或拖拽</b> 选择 Excel 文件（.xlsx）</div>
      <div class="hint">支持「订单项目收退款表-明细」同结构文件；数据仅在本机浏览器解析，不上传。</div>
    </div>
    <input type="file" id="file" accept=".xlsx,.xls" />
    <div class="mini-bar" id="miniBar" style="display:none;">
      <span class="ficon">📊</span>
      <span class="fname" id="fName"></span>
      <span class="fmeta" id="fMeta"></span>
      <button type="button" class="reimport" id="reimport">重新导入</button>
    </div>
    <div class="schema">期望字段（按关键字自动匹配）：<code>日期/收款时间</code> <code>收款金额-现款支付</code> <code>关联订单信息-订单开单科室</code> <code>订单所属-订单分诊医生</code> <code>关联订单信息-开单咨询师</code> <code>关联客户信息-会员号</code></div>
    <div class="status" id="status"></div>
  </div>

  <div id="tables" style="display:none">
    <section class="card" id="cardDept">
      <h3><span class="t"><span class="bar"></span>月度各科室业绩统计分析</span>
        <span class="tbl-ops"><span class="tag" id="deptTag"></span>
        <button type="button" class="btn" id="btnXlsxDept" title="导出表A（SheetJS 社区版不保留单元格样式，仅结构与数据）">导出表A</button></span></h3>
      <div class="table-card"><table class="mt" id="tblDept"></table></div>
      <div class="mt-note" id="deptNote"></div>
    </section>
    <section class="card" id="cardMgr">
      <h3><span class="t"><span class="bar"></span>月度管家业绩统计分析（健康管家）</span>
        <span class="tbl-ops"><span class="tag" id="mgrTag"></span>
        <button type="button" class="btn" id="btnXlsxMgr" title="导出表B（SheetJS 社区版不保留单元格样式）">导出表B</button></span></h3>
      <div class="table-card"><table class="mt" id="tblMgr"></table></div>
      <div class="mt-note" id="mgrNote"></div>
    </section>
  </div>

  <div id="placeholder" class="empty">尚未导入数据 —— 请先选择 Excel 文件。</div>
</div>

<script src="/shared/kpi-cloud-sync.js?v=20261016a"></script>
<script src="./vendor/xlsx.full.min.js"></script>
<script>
(function(){
  'use strict';
  var drop=document.getElementById('drop'), file=document.getElementById('file'), status=document.getElementById('status');
  var importCard=document.getElementById('importCard'), miniBar=document.getElementById('miniBar');
  drop.addEventListener('click',function(){file.click();});
  miniBar.addEventListener('click',function(e){ if(e.target.id!=='reimport') file.click(); });
  document.getElementById('reimport').addEventListener('click',function(e){ e.stopPropagation(); file.click(); });
  file.addEventListener('change',function(e){ if(e.target.files[0]) loadFile(e.target.files[0]); });
  ['dragover','dragenter'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('drag');});});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('drag');});});
  drop.addEventListener('drop',function(e){ var f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) loadFile(f); });

  function setStatus(msg,type){ status.textContent=msg; status.className='status'+(type?(' '+type):''); }

  /* ---------- 列头解析：别名数组 + 精确优先 + 包含兜底 + 命中锁定 ---------- */
  var COLS={
    ym:['日期','收款时间','收款日期'],
    cash:['收款金额-现款支付','现款支付'],
    dept:['关联订单信息-订单开单科室','订单开单科室','开单科室'],
    doctor:['订单所属-订单分诊医生','订单分诊医生','分诊医生'],
    consultant:['关联订单信息-开单咨询师','订单开单咨询师','开单咨询师'],
    member:['关联客户信息-会员号','会员号']
  };

  function resolveHeaders(headers){
    var map={}, used={}, keys=Object.keys(COLS);
    function lock(i,key){ used[i]=1; map[key]=headers[i]; }
    // pass1：按别名顺序做精确匹配（别名数组顺序即优先级）
    keys.forEach(function(k){
      var kws=COLS[k];
      for(var a=0;a<kws.length;a++){
        for(var i=0;i<headers.length;i++){
          if(!headers[i]||used[i]) continue;
          if(String(headers[i])===kws[a]){ lock(i,k); return; }
        }
      }
    });
    // pass2：包含兜底（跳过已被其他字段占用的表头，防止一列两吃）
    keys.forEach(function(k){
      if(map[k]!=null) return;
      var kws=COLS[k];
      for(var a=0;a<kws.length;a++){
        for(var i=0;i<headers.length;i++){
          if(!headers[i]||used[i]) continue;
          if(String(headers[i]).indexOf(kws[a])>=0){ lock(i,k); return; }
        }
      }
    });
    return map;
  }

  function num(v){ if(v===null||v===undefined||v==='') return 0; var n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; }
  function strVal(v){ return v==null?'':String(v).trim(); }
  function excelMonth(n){
    var d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);
    return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2);
  }
  /* Excel 日期序列号（如 46293）必须按 1899-12-30 基准换算，
     否则 new Date("46293") 会被解析成公元 46293 年 → 产生大量假月份 */
  function monthKey(v){
    if(v===null||v===undefined||v==='') return null;
    if(typeof v==='number'){ if(v>20000&&v<80000) return excelMonth(v); }
    var s=String(v).trim();
    if(/^\d+(\.\d+)?$/.test(s)){ var n=parseFloat(s); if(n>20000&&n<80000) return excelMonth(n); }
    var m=s.match(/(\d{4})[-/年.](\d{1,2})/);
    if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
    return null;
  }
  function rowMonth(r,map){
    var v = (map.ym!=null) ? r[map.ym] : ((map.date!=null) ? r[map.date] : null);
    return monthKey(v);
  }
  function fmt(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtInt(n){ return n.toLocaleString('zh-CN'); }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function isRealMember(m){ return m && m!=='公司所有' && m!=='无' && m!=='未归类'; }

  /* ---------- 仪表盘状态 ---------- */
  var dash={ rows:null, map:null, fname:'', months:[], scope:'__all__' };  // scope: '__all__' | 'YYYY-MM'

  /* ---------- 口径常量 ---------- */
  var DEPT_ORDER=['健管部','诊疗部','前台'];
  var DEPT_OF_CLINIC={
    '营养科':'健管部','预防医学科':'健管部','健管三组':'健管部','特需科':'健管部','特需治疗科':'健管部',
    '全科':'诊疗部','国际门诊':'诊疗部','新妇科':'诊疗部','儿科':'诊疗部','中医科':'诊疗部',
    '口腔科':'诊疗部','专家组':'诊疗部','体检科':'诊疗部'
  };
  var CLINIC_LABEL={'特需科':'特需治疗科'};
  var CLINIC_ORDER={
    '健管部':['预防医学科','营养科','健管三组','特需科','特需治疗科'],
    '诊疗部':['全科','国际门诊','新妇科','儿科','中医科','口腔科','专家组','体检科']
  };
  var FRONT_ROWS=['营销部','团检','其他'];   // 前台组只出合计行，不列医生明细
  var ORAL_DOCTOR='安志国';                 // 订单开单科室=口腔科 → 业绩全部计入安志国
  var MANAGER_ROSTER=['白雪花','赵静','严淑杰','黄果','李方媛','王勤红','房雨倩','刘梓珺'];
  var MGR_EXCLUDE=['营销部','吴雅琴','许顺华','张帆'];  // 不展示、不计入
  var MGR_REFERENCE=['徐美琪','张亚超'];                // 展示为参考行，不计入管家合计
  var TGT_KEY='monthly_mgr_targets_v1';
  var TGT_DEFAULT={'无':300000,'全院合计':3000000};

  /* ---------- 数据落地 + UI 切换：本地导入与「云端恢复」共用同一条路径 ---------- */
  function applyData(rows, map, fname, fromCloud){
    dash.rows=rows; dash.map=map; dash.fname=fname; dash.scope='__all__';
    dash.months=(function(){ var s=new Set(); rows.forEach(function(r){ var m=rowMonth(r,map); if(m) s.add(m); }); return Array.from(s).sort(); })();
    importCard.classList.add('mini');
    document.getElementById('drop').style.display='none';
    miniBar.style.display='flex';
    document.getElementById('fName').textContent=fname;
    document.getElementById('fMeta').textContent=fmtInt(rows.length)+' 行 · 覆盖 '+dash.months.length+' 个月（'+dash.months.join('、')+'）';
    setStatus((fromCloud?'已从云端恢复 ':'已导入 ')+fmtInt(rows.length)+' 行','ok');
    renderDashboard();
  }

  function loadFile(f){
    setStatus('正在解析 '+f.name+' …');
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        var ws=wb.SheetNames.length?wb.Sheets[wb.SheetNames[0]]:null;
        if(!ws){ setStatus('文件中没有可读取的工作表。','err'); return; }
        var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        if(!rows.length){ setStatus('工作表为空，请检查数据。','err'); return; }
        var headers=Object.keys(rows[0]);
        var map=resolveHeaders(headers);
        if(map.cash==null){ setStatus('未匹配到关键列（收款金额-现款支付），请确认文件结构。','err'); return; }
        if(map.ym==null&&map.date==null){ setStatus('未匹配到月份列（日期 / 收款时间），请确认文件结构。','err'); return; }
        var miss=[];
        if(map.dept==null) miss.push('订单开单科室');
        if(map.doctor==null) miss.push('订单分诊医生');
        if(map.consultant==null) miss.push('开单咨询师');
        if(map.member==null) miss.push('会员号');
        applyData(rows, map, f.name, false);
        if(miss.length) setStatus('已导入 '+fmtInt(rows.length)+' 行；未匹配到：'+miss.join(' / ')+'（相关表将部分为空）','ok');
        if(window.KpiCloudSync) window.KpiCloudSync.markDirty();
      }catch(err){ setStatus('解析失败：'+err.message,'err'); }
    };
    reader.readAsArrayBuffer(f);
  }

  /* ---------- 月份切换 chips ---------- */
  function renderChips(){
    var el=document.getElementById('chips');
    el.style.display='flex';
    var html='<button type="button" class="chip'+(dash.scope==='__all__'?' active':'')+'" data-scope="__all__">全部月份</button>';
    html+=dash.months.map(function(m){
      return '<button type="button" class="chip'+(dash.scope===m?' active':'')+'" data-scope="'+m+'">'+m+'</button>';
    }).join('');
    el.innerHTML=html;
    el.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click',function(){ dash.scope=c.dataset.scope; renderDashboard(); });
    });
  }

  /* ================= 表A：月度各科室业绩统计分析 ================= */
  /* 结构：部门 → 科室 → 医生；部门末出合计行；前台组仅 营销部/团检/其他 三行合计；全院合计行。
     业绩=收款金额-现款支付；容量=去重会员号（医生为跨科室合并去重，合计行各自重新去重，故≠相加）。 */
  function aggregateDept(rows,map){
    var docs={}, frontCash={}, totalCash=0, totalMem=new Set();
    var deptCash={}, deptMem={};
    DEPT_ORDER.forEach(function(d){ deptCash[d]=0; deptMem[d]=new Set(); });
    FRONT_ROWS.forEach(function(f){ frontCash[f]=0; });

    rows.forEach(function(r){
      var cash=num(r[map.cash]||0);
      totalCash+=cash;
      var mem=strVal(r[map.member]);
      if(map.member!=null && isRealMember(mem)) totalMem.add(mem);
      var clinic=strVal(r[map.dept])||'未归类';
      var doctor=strVal(r[map.doctor])||'未归类';
      if(clinic==='口腔科') doctor=ORAL_DOCTOR;      // 口腔科全部归安志国
      var dept=DEPT_OF_CLINIC[clinic]||null;
      if(dept){
        deptCash[dept]+=cash;
        if(map.member!=null && isRealMember(mem)) deptMem[dept].add(mem);
        var d=docs[doctor];
        if(!d){ d=docs[doctor]={cash:0,mem:new Set(),clinics:{},primary:null,primaryCash:-1}; docs[doctor]=d; }
        d.cash+=cash;
        if(map.member!=null && isRealMember(mem)) d.mem.add(mem);
        d.clinics[clinic]=(d.clinics[clinic]||0)+cash;
        if(cash>d.primaryCash){ d.primaryCash=cash; d.primary=clinic; }
      }else{
        // 前台类：营销部 / 团检 / 其他（前台、无、未归类、空、未映射科室）
        var fk=(clinic==='营销部'||clinic==='团检')?clinic:'其他';
        frontCash[fk]+=cash;
      }
    });

    // 医生剔除无名行（无/未归类），只保留可归属到科室的医生
    Object.keys(docs).forEach(function(k){ if(k==='无'||k==='未归类'||k==='') delete docs[k]; });

    var groups=[];
    DEPT_ORDER.forEach(function(dept){
      if(dept==='前台'){
        groups.push({dept:'前台',front:FRONT_ROWS.map(function(f){ return {clinic:f,cash:frontCash[f]}; })});
        return;
      }
      var byClinic={};
      Object.keys(docs).forEach(function(name){
        var d=docs[name];
        var cl=d.primary;
        if(DEPT_OF_CLINIC[cl]!==dept) return;
        (byClinic[cl]=byClinic[cl]||[]).push({name:name,cash:d.cash,cap:d.mem.size});
      });
      var names=Object.keys(byClinic);
      var ordered=(CLINIC_ORDER[dept]||[]).filter(function(c){ return names.indexOf(c)>=0; });
      names.forEach(function(c){ if(ordered.indexOf(c)<0) ordered.push(c); });
      var clinics=ordered.map(function(c){
        var list=byClinic[c].sort(function(a,b){ return b.cash-a.cash; });   // 0 元行保留，排最后
        return {clinic:c,label:CLINIC_LABEL[c]||c,docs:list};
      });
      var docCount=0; clinics.forEach(function(c){ docCount+=c.docs.length; });
      groups.push({
        dept:dept, clinics:clinics, docCount:docCount,
        subtotal:{cash:deptCash[dept],cap:deptMem[dept].size}
      });
    });
    return {groups:groups, total:{cash:totalCash,cap:totalMem.size}, doctorCount:Object.keys(docs).length};
  }

  function renderDeptTable(a){
    var html='<thead><tr><th colspan="3" class="hd-l">科室</th><th>业绩（单位：元）</th><th>容量（单位：人）</th></tr></thead><tbody>';
    a.groups.forEach(function(g){
      if(g.front){
        g.front.forEach(function(fr,i){
          if(i===0) html+='<tr><td rowspan="'+g.front.length+'" class="dept">前台</td>';
          else html+='<tr>';
          html+='<td class="clinic">'+escapeHtml(fr.clinic)+'</td><td class="doc-lbl">合计</td>'
            +'<td class="num">'+fmt(fr.cash)+'</td><td class="num dim">/</td></tr>';
        });
        return;
      }
      var rowspan=g.docCount+1;   // 医生行 + 部门合计行
      g.clinics.forEach(function(c,ci){
        c.docs.forEach(function(d,di){
          if(ci===0&&di===0) html+='<tr><td rowspan="'+rowspan+'" class="dept">'+escapeHtml(g.dept)+'</td>';
          else html+='<tr>';
          if(di===0) html+='<td rowspan="'+c.docs.length+'" class="clinic">'+escapeHtml(c.label)+'</td>';
          html+='<td class="doc">'+escapeHtml(d.name)+'</td><td class="num">'+fmt(d.cash)+'</td><td class="num">'+fmtInt(d.cap)+'</td></tr>';
        });
      });
      html+='<tr class="sum"><td colspan="2" class="sum-lbl">'+escapeHtml(g.dept)+'合计</td>'
        +'<td class="num">'+fmt(g.subtotal.cash)+'</td><td class="num">'+fmtInt(g.subtotal.cap)+'</td></tr>';
    });
    html+='<tr class="total"><td colspan="3" class="sum-lbl">全院合计</td>'
      +'<td class="num">'+fmt(a.total.cash)+'</td><td class="num">'+fmtInt(a.total.cap)+'</td></tr>';
    html+='</tbody>';
    document.getElementById('tblDept').innerHTML=html;
  }

  /* ================= 表B：月度管家业绩统计分析（健康管家） ================= */
  function aggregateManager(rows,map){
    var mgr={}, totalCash=0, totalMem=new Set();
    rows.forEach(function(r){
      var cash=num(r[map.cash]||0);
      totalCash+=cash;
      var mem=strVal(r[map.member]);
      if(map.member!=null && isRealMember(mem)) totalMem.add(mem);
      var name=strVal(r[map.consultant])||'无';
      if(map.consultant==null) name='（未匹配到开单咨询师列）';
      var m=mgr[name];
      if(!m){ m=mgr[name]={cash:0,mem:new Set()}; mgr[name]=m; }
      m.cash+=cash;
      if(map.member!=null && isRealMember(mem)) m.mem.add(mem);
    });
    var rowsOut=[];
    MANAGER_ROSTER.forEach(function(n){
      var m=mgr[n];
      rowsOut.push({name:n,cash:m?m.cash:0,kind:'roster'});
    });
    MGR_REFERENCE.forEach(function(n){
      var m=mgr[n];
      if(!m) return;
      rowsOut.push({name:n,cash:m.cash,kind:'ref'});
    });
    // 其余未在名册/参考/排除名单内的开单咨询师，按业绩降序补充展示（不计入管家合计）
    var extra=[];
    Object.keys(mgr).forEach(function(n){
      if(MANAGER_ROSTER.indexOf(n)>=0||MGR_REFERENCE.indexOf(n)>=0||MGR_EXCLUDE.indexOf(n)>=0) return;
      if(n==='无') return;
      extra.push({name:n,cash:mgr[n].cash,kind:'extra'});
    });
    extra.sort(function(x,y){ return y.cash-x.cash; });
    rowsOut=rowsOut.concat(extra);
    var rosterSum=0;
    rowsOut.forEach(function(r){ if(r.kind==='roster') rosterSum+=r.cash; });
    return {rows:rowsOut, rosterSum:rosterSum, none:mgr['无']?mgr['无'].cash:0, total:{cash:totalCash,cap:totalMem.size}, mgr:mgr};
  }

  function tgtStore(){ try{ return JSON.parse(localStorage.getItem(TGT_KEY))||{}; }catch(e){ return {}; } }
  function tgtGet(scope,name){
    var s=tgtStore(), b=s[scope]||{};
    var v=b[name];
    if(v==null||v==='') return (TGT_DEFAULT[name]!=null?TGT_DEFAULT[name]:0);
    var n=Number(v); return isNaN(n)?0:n;
  }
  function tgtSet(scope,name,v){
    var s=tgtStore();
    s[scope]=s[scope]||{};
    s[scope][name]=v;
    try{ localStorage.setItem(TGT_KEY,JSON.stringify(s)); }catch(e){}
  }
  function rateText(actual,target){
    if(!(target>0)) return {txt:'/',cls:''};
    var p=actual/target*100;
    return {txt:p.toFixed(1)+'%',cls:p>=100?'good':'bad'};
  }

  function renderManagerTable(b,monthLabel){
    var scope=dash.scope;
    var html='<thead>'
      +'<tr><th rowspan="2" class="hd-l">健康管家</th><th colspan="3">'+escapeHtml(monthLabel)+'</th></tr>'
      +'<tr><th>月业绩目标</th><th>实际完成</th><th>月完成率</th></tr></thead><tbody>';
    b.rows.forEach(function(r){
      var tgt=tgtGet(scope,r.name);
      var rt=rateText(r.cash,tgt);
      var cls=r.kind==='ref'?' class="ref-row"':'';
      var nameHtml=escapeHtml(r.name)+(r.kind==='ref'?'<i class="ref-mark">参考</i>':'');
      html+='<tr'+cls+'><td class="doc'+(r.kind==='ref'?' ref-name':'')+'">'+nameHtml+'</td>'
        +'<td class="tgt-cell"><input class="tgt-input" type="number" step="0.01" min="0" data-rbac="editTargets" data-name="'+escapeHtml(r.name)+'" value="'+(tgt||'')+'" title="月业绩目标（可手工编辑，按月保存）"></td>'
        +'<td class="num rate bad">'+fmt(r.cash)+'</td>'
        +'<td class="num rate '+rt.cls+'" data-rate-for="'+escapeHtml(r.name)+'">'+rt.txt+'</td></tr>';
    });
    // 「无」行：未填开单咨询师的订单
    var noneTgt=tgtGet(scope,'无'), noneRt=rateText(b.none,noneTgt);
    html+='<tr class="wu-row"><td class="doc">无</td>'
      +'<td class="tgt-cell"><input class="tgt-input" type="number" step="0.01" min="0" data-rbac="editTargets" data-name="无" value="'+(noneTgt||'')+'" title="月业绩目标（可手工编辑，按月保存）"></td>'
      +'<td class="num rate bad">'+fmt(b.none)+'</td>'
      +'<td class="num rate '+noneRt.cls+'" data-rate-for="无">'+noneRt.txt+'</td></tr>';
    // 管家合计（名册口径）
    var sumTgt=0;
    b.rows.forEach(function(r){ if(r.kind==='roster') sumTgt+=tgtGet(scope,r.name); });
    var sumRt=rateText(b.rosterSum,sumTgt);
    html+='<tr class="sum"><td class="doc">管家合计</td>'
      +'<td class="num">'+(sumTgt?fmt(sumTgt):'0')+'</td>'
      +'<td class="num rate bad">'+fmt(b.rosterSum)+'</td>'
      +'<td class="num rate '+sumRt.cls+'" data-rate-for="管家合计">'+sumRt.txt+'</td></tr>';
    // 全院合计
    var allTgt=tgtGet(scope,'全院合计'), allRt=rateText(b.total.cash,allTgt);
    html+='<tr class="total"><td class="doc">全院合计</td>'
      +'<td class="tgt-cell"><input class="tgt-input" type="number" step="0.01" min="0" data-rbac="editTargets" data-name="全院合计" value="'+(allTgt||'')+'" title="月业绩目标（可手工编辑，按月保存）"></td>'
      +'<td class="num rate bad">'+fmt(b.total.cash)+'</td>'
      +'<td class="num rate '+allRt.cls+'" data-rate-for="全院合计">'+allRt.txt+'</td></tr>';
    html+='</tbody>';
    var tbl=document.getElementById('tblMgr');
    tbl.innerHTML=html;
    tbl.querySelectorAll('.tgt-input').forEach(function(inp){
      inp.addEventListener('input',function(){
        var name=inp.dataset.name, v=parseFloat(inp.value);
        tgtSet(dash.scope,name,isNaN(v)?0:v);
        refreshManagerRates(b);
        if(window.KpiCloudSync) window.KpiCloudSync.markDirty();
      });
    });
  }

  /* 目标输入后只刷新完成率与合计目标，不整表重绘（避免输入框失焦） */
  function refreshManagerRates(b){
    var scope=dash.scope;
    var tbl=document.getElementById('tblMgr');
    b.rows.forEach(function(r){
      var rt=rateText(r.cash,tgtGet(scope,r.name));
      var cell=tbl.querySelector('[data-rate-for="'+cssEsc(r.name)+'"]');
      if(cell){ cell.textContent=rt.txt; cell.className='num rate '+rt.cls; }
    });
    var noneRt=rateText(b.none,tgtGet(scope,'无'));
    var nc=tbl.querySelector('[data-rate-for="无"]');
    if(nc){ nc.textContent=noneRt.txt; nc.className='num rate '+noneRt.cls; }
    var sumTgt=0;
    b.rows.forEach(function(r){ if(r.kind==='roster') sumTgt+=tgtGet(scope,r.name); });
    var sumRt=rateText(b.rosterSum,sumTgt);
    var sumTgtCell=tbl.querySelector('tr.sum td.num');
    if(sumTgtCell) sumTgtCell.textContent=sumTgt?fmt(sumTgt):'0';
    var sc=tbl.querySelector('[data-rate-for="管家合计"]');
    if(sc){ sc.textContent=sumRt.txt; sc.className='num rate '+sumRt.cls; }
    var allRt=rateText(b.total.cash,tgtGet(scope,'全院合计'));
    var ac=tbl.querySelector('[data-rate-for="全院合计"]');
    if(ac){ ac.textContent=allRt.txt; ac.className='num rate '+allRt.cls; }
  }
  function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }

  /* ---------- 总渲染入口 ---------- */
  function renderDashboard(){
    var all=dash.rows, map=dash.map;
    if(!all||!all.length) return;
    renderChips();
    var inScope = dash.scope==='__all__' ? all : all.filter(function(r){ return rowMonth(r,map)===dash.scope; });
    var monthLabel = dash.scope==='__all__'
      ? (dash.months.length ? (parseInt(dash.months[dash.months.length-1].slice(5),10)+'月') : '全部月份')
      : (parseInt(dash.scope.slice(5),10)+'月');
    var scopeLabel = dash.scope==='__all__' ? '全部月份' : dash.scope;

    document.getElementById('placeholder').style.display='none';
    document.getElementById('tables').style.display='block';

    var a=aggregateDept(inScope,map);
    renderDeptTable(a);
    var b=aggregateManager(inScope,map);
    renderManagerTable(b,monthLabel);

    document.getElementById('deptTag').textContent=scopeLabel;
    document.getElementById('mgrTag').textContent=scopeLabel;
    document.getElementById('deptNote').textContent=
      '口径：业绩＝收款金额-现款支付合计；容量＝去重会员号数（医生容量为该医生全部订单跨科室合并去重，部门/全院合计为各自重新去重，故不等于各行相加）。'
      +'「关联订单信息-订单开单科室」为口腔科的订单，业绩全部计入安志国。前台组（营销部/团检/其他）不列医生明细，容量不统计。'
      +'月份以「日期」列为准，未匹配时回退「收款时间」。';
    document.getElementById('mgrNote').textContent=
      '口径：实际完成＝「关联订单信息-开单咨询师」名下的现款支付合计；「无」＝未填开单咨询师的订单；'
      +'营销部 / 吴雅琴 / 许顺华 / 张帆 不纳入管家统计；'+MGR_REFERENCE.join(' / ')+' 为参考行（显示但不计入管家合计）。'
      +'月业绩目标可手工编辑，按月份分别保存并同步云端；完成率＝实际完成 ÷ 月业绩目标，目标 ≤0 显示「/」。';
  }

  /* ================= 导出 ================= */
  function buildDeptAoa(a){
    var aoa=[['科室','','','业绩（单位：元）','容量（单位：人）']];
    var merges=[{s:{r:0,c:0},e:{r:0,c:2}}];
    function merge(r1,c1,r2,c2){ if(r1===r2&&c1===c2) return; merges.push({s:{r:r1,c:c1},e:{r:r2,c:c2}}); }
    a.groups.forEach(function(g){
      var r0=aoa.length;
      if(g.front){
        g.front.forEach(function(fr,i){
          if(i===0) aoa.push([g.dept,fr.clinic,'合计',fr.cash,'/']);
          else aoa.push(['',fr.clinic,'合计',fr.cash,'/']);
        });
        merge(r0,0,r0+g.front.length-1,0);
        return;
      }
      g.clinics.forEach(function(c){
        var cr0=aoa.length;
        c.docs.forEach(function(d,di){
          if(di===0) aoa.push(['',c.label,d.name,d.cash,d.cap]);
          else aoa.push(['','',d.name,d.cash,d.cap]);
        });
        merge(cr0,1,aoa.length-1,1);
      });
      aoa.push(['',g.dept+'合计','',g.subtotal.cash,g.subtotal.cap]);
      merge(aoa.length-1,0,aoa.length-1,1);
      merge(r0,0,aoa.length-1,0);
    });
    aoa.push(['','','全院合计',a.total.cash,a.total.cap]);
    merge(aoa.length-1,0,aoa.length-1,2);
    return {aoa:aoa,merges:merges};
  }

  function buildMgrAoa(b,monthLabel){
    var scope=dash.scope;
    var aoa=[['健康管家',monthLabel,'',''],['','月业绩目标','实际完成','月完成率']];
    var merges=[{s:{r:0,c:0},e:{r:1,c:0}},{s:{r:0,c:1},e:{r:0,c:3}}];
    b.rows.forEach(function(r){
      var t=tgtGet(scope,r.name);
      aoa.push([r.name+(r.kind==='ref'?'（参考）':''),t||0,r.cash,(t>0?r.cash/t:null)]);
    });
    aoa.push(['无',tgtGet(scope,'无')||0,b.none,(tgtGet(scope,'无')>0?b.none/tgtGet(scope,'无'):null)]);
    var sumTgt=0;
    b.rows.forEach(function(r){ if(r.kind==='roster') sumTgt+=tgtGet(scope,r.name); });
    aoa.push(['管家合计',sumTgt,b.rosterSum,(sumTgt>0?b.rosterSum/sumTgt:null)]);
    aoa.push(['全院合计',tgtGet(scope,'全院合计')||0,b.total.cash,(tgtGet(scope,'全院合计')>0?b.total.cash/tgtGet(scope,'全院合计'):null)]);
    // 完成率列设为百分比格式
    for(var i=2;i<aoa.length;i++){
      var cell=aoa[i][3];
      if(cell!=null && !isNaN(cell)){
        aoa[i][3]={v:cell,t:'n',z:'0.0%'};
      }else{
        aoa[i][3]='/';
      }
    }
    return {aoa:aoa,merges:merges};
  }

  function exportTable(which){
    if(!dash.rows||!dash.rows.length||!window.XLSX){ setStatus('暂无数据可导出。','err'); return; }
    var inScope = dash.scope==='__all__' ? dash.rows : dash.rows.filter(function(r){ return rowMonth(r,dash.map)===dash.scope; });
    var suffix = dash.scope==='__all__' ? '全部月份' : dash.scope;
    try{
      if(which==='dept'){
        var m=buildDeptAoa(aggregateDept(inScope,dash.map));
        var ws=XLSX.utils.aoa_to_sheet(m.aoa);
        ws['!merges']=m.merges;
        ws['!cols']=[{wch:12},{wch:16},{wch:14},{wch:18},{wch:14}];
        var wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,'各科室业绩统计');
        XLSX.writeFile(wb,'月度各科室业绩统计_'+suffix+'.xlsx');
        setStatus('已导出表A：月度各科室业绩统计_'+suffix+'.xlsx','ok');
      }else{
        var monthLabel = dash.scope==='__all__'
          ? (dash.months.length ? (parseInt(dash.months[dash.months.length-1].slice(5),10)+'月') : '全部月份')
          : (parseInt(dash.scope.slice(5),10)+'月');
        var mm=buildMgrAoa(aggregateManager(inScope,dash.map),monthLabel);
        var ws2=XLSX.utils.aoa_to_sheet(mm.aoa);
        ws2['!merges']=mm.merges;
        ws2['!cols']=[{wch:16},{wch:14},{wch:16},{wch:12}];
        var wb2=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb2,ws2,'管家业绩统计');
        XLSX.writeFile(wb2,'月度管家业绩统计_'+suffix+'.xlsx');
        setStatus('已导出表B：月度管家业绩统计_'+suffix+'.xlsx','ok');
      }
    }catch(err){ setStatus('导出失败：'+err.message,'err'); }
  }
  document.getElementById('btnXlsxDept').addEventListener('click',function(){ exportTable('dept'); });
  document.getElementById('btnXlsxMgr').addEventListener('click',function(){ exportTable('mgr'); });

  /* ---------- 云端持久化（WorkBuddy Cloud Service，按账号隔离） ----------
   * 目的：导入的明细与聚合结果不随浏览器/设备丢失。整包 JSONB 快照存 dp_monthly，
   * 每账号一行（owner_id 由服务端 auth.uid() 填充 + RLS 隔离），未登录时不影响本机使用。 */
  window.CLOUD_ENDPOINT = window.CLOUD_ENDPOINT || 'https://haibei-medical.app.workbuddy.host';
  window.CLOUD_PK = window.CLOUD_PK || 'wbpk_KQXIeDHLXWDHN7WQp3zqUQ_Y5IlM6hJd7n10U8UN5bYmSGUYeevVOwl';
  var KPI_TS_KEY = 'kpi_cloud_ts_monthly';
  function dashPayload(){
    if(!dash.rows || !dash.rows.length || !dash.map) return null;
    return { rows: dash.rows, map: dash.map, fname: dash.fname || '', scope: dash.scope || '__all__', targets: tgtStore(), ts: Date.now() };
  }
  function applyDashPayload(p){
    if(!p || !Array.isArray(p.rows) || !p.rows.length || !p.map) return;
    var map=p.map;
    if(typeof map==='string'){ try{ map=JSON.parse(map); }catch(e){} }
    if(!map || typeof map!=='object') return;
    // 旧快照的 map 可能是旧表头键 → 用当前表头重算一次，失败再回退旧 map
    try{
      var fresh=resolveHeaders(Object.keys(p.rows[0]||{}));
      if(fresh.cash!=null && (fresh.ym!=null||fresh.date!=null)) map=fresh;
    }catch(e){}
    if(map.cash==null) return;
    if(p.targets && typeof p.targets==='object'){
      try{
        var s=tgtStore();
        Object.keys(p.targets).forEach(function(k){ if(!s[k] || !Object.keys(s[k]||{}).length) s[k]=p.targets[k]; });
        localStorage.setItem(TGT_KEY,JSON.stringify(s));
      }catch(e){}
    }
    applyData(p.rows, map, p.fname || '云端数据', true);
    if(p.scope){ dash.scope=p.scope; }
    renderDashboard();
  }
  if(window.KpiCloudSync){
    window.KpiCloudSync.start({
      table: 'dp_monthly',
      tsKey: KPI_TS_KEY,
      collect: dashPayload,
      apply: applyDashPayload,
      isEmpty: function(p){ return !(p && Array.isArray(p.rows) && p.rows.length); },
      countOf: function(p){ return (p && Array.isArray(p.rows)) ? p.rows.length : 0; }
    });
  }
})();

<script>
/* 敏感操作 → 权限点映射：集中维护，rbac.js 守卫据此禁用无权限按钮（导入/导出/清除/编辑/重算）。
   覆盖全站各页常见触发器，不存在的选择器自动跳过。 */
(function(){
  var MAP = {
    'file-orders':'import','file-vab':'import','fileVab':'import','fileOrder':'import',
    'fileCharge':'import','fileProjMap':'import','fileBoth':'import','fileAppt':'import',
    'file':'import','drop':'import','reimport':'import',
    'export-xlsx':'export','export-png':'export','export-store-xlsx':'export','export-store-png':'export',
    'vabExport':'export','orderExport':'export','chargeExport':'export','statsExport':'export',
    'consExport':'export','projExport':'export','projExportMap':'export','btnPng':'export','btnXlsx':'export','btnNextPng':'export','btnNextXlsx':'export',
    'btnXlsxDept':'export','btnXlsxMgr':'export',
    'clear-vab':'clear','clear-manual':'clear','clear-date':'clear','clear-all':'clear','projClearMap':'clear','btnClearOV':'clear',
    'edit-vab':'editVab','vab-add-save':'editVab','recompute':'recompute'
  };
  function tag(){
    Object.keys(MAP).forEach(function(id){
      var el = document.getElementById(id);
      if(el && !el.hasAttribute('data-rbac')) el.setAttribute('data-rbac', MAP[id]);
    });
  }
  if(document.readyState!=='loading') tag(); else document.addEventListener('DOMContentLoaded', tag);
})();
</script>
<script src="/shared/auth-gate.js?v=20261020c"></script>
