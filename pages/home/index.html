<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>首页 · 工作台</title>
<style>
  :root{
    --navy:#002060; --navy-2:#1e3a8a; --navy-3:#4a7bb5;
    --bg:#F5F7FA; --card:#FFFFFF; --border:#E2E8F0;
    --text:#1A202C; --muted:#64748B;
    --accent:#3658d3; --success:#2E7D5B; --danger:#C0392B;
    --radius:12px;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.35;overflow-x:hidden;}
  .home-wrap{max-width:1280px;margin:0 auto;padding:14px 20px 36px;}

  /* 顶部欢迎条 */
  .hero{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px;flex-wrap:wrap;gap:8px;}
  .hero .hi{font-size:20px;font-weight:700;color:var(--navy);}
  .hero .hi small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px;}
  .hero .date{font-size:12.5px;color:var(--muted);}

  /* 三栏网格：主区两列 + 右侧栏（start：各列按内容自然高度，无强制拉伸留白） */
  .grid3{display:grid;grid-template-columns:1fr 1fr 300px;gap:12px;align-items:start;}
  .col-main{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
  .col-side{display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;box-shadow:0 1px 3px rgba(15,23,42,.05);display:flex;flex-direction:column;min-width:0;}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-shrink:0;}
  .card-h b{font-size:14.5px;color:var(--navy);white-space:nowrap;}
  .card-h a,.card-h .more{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap;}

  /* 指标行式列表（标签左 · 数值右，固定紧凑行距，不拉伸） */
  .range-line{font-size:11.5px;color:var(--muted);margin:-4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
  .sub-grid{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
  .sub-grid .s{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:12px;color:var(--muted);white-space:nowrap;}
  .sub-grid .s b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;}

  /* KPI 大数字 */
  .kpi-big{display:flex;align-items:baseline;gap:10px;margin:2px 0 0;}
  .kpi-big .num{font-size:34px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;}
  .kpi-big .delta{font-size:12px;font-weight:600;}
  .kpi-big .delta.up{color:var(--success);} .kpi-big .delta.down{color:var(--danger);}

  /* 环形占比（conic-gradient，无依赖） */
  .donut-row{display:flex;align-items:center;gap:14px;margin-top:9px;}
  .donut{width:96px;height:96px;border-radius:50%;position:relative;flex-shrink:0;
    background:conic-gradient(var(--navy) 0deg, var(--navy) 360deg);}
  .donut::after{content:"";position:absolute;inset:22px;background:#fff;border-radius:50%;}
  .donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:11px;color:var(--muted);}
  .donut .c b{font-size:15px;color:var(--navy);}
  .legend{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0;}
  .legend .li{display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .legend .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}

  /* 常见应用图标（单行横排 7 个，省掉第二行高度） */
  .apps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .app{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:all .15s;user-select:none;}
  .app:hover{background:#F2F6FD;border-color:#dbe6f7;transform:translateY(-1px);}
  .app .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}
  .app .nm{font-size:11px;color:var(--text);text-align:center;}

  /* 双周对比条形（压缩高度，减少整卡留白） */
  .bars{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
  .bar-row .lab{width:64px;flex-shrink:0;text-align:right;}
  .bar-row .track{flex:1;height:8px;background:#EEF2F8;border-radius:999px;overflow:hidden;min-width:0;}
  .bar-row .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--navy-3),var(--navy));min-width:2px;transition:width .4s;}
  .bar-row .val{width:90px;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--text);}

  /* 快捷入口列表 */
  .links{display:flex;flex-direction:column;gap:6px;}
  .lnk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);
    background:#F7F9FC;border:1px solid #EDF1F7;border-radius:9px;padding:7px 10px;cursor:pointer;transition:all .15s;}
  .lnk:hover{border-color:#c9d8f2;background:#F2F6FD;}
  .lnk .ico{font-size:15px;}
  .lnk .tail{margin-left:auto;font-size:11px;color:var(--muted);}

  /* 公告 */
  .notes{display:flex;flex-direction:column;gap:6px;}
  .note{font-size:12.5px;color:var(--text);line-height:1.4;padding-left:9px;border-left:3px solid #dbe6f7;}
  .note b{color:var(--navy);margin-right:6px;font-variant-numeric:tabular-nums;}

  .empty{color:var(--muted);font-size:12.5px;padding:8px 0;}
  @media (max-width:1100px){ .grid3{grid-template-columns:1fr 1fr;} .col-side{grid-column:1/-1;} }
  @media (max-width:760px){ .grid3{grid-template-columns:1fr;} .col-main{grid-template-columns:1fr;} .apps{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>
<div class="home-wrap">
  <div class="hero">
    <div class="hi" id="greet">你好<small>数据统计平台 · 工作台</small></div>
    <div class="date" id="today"></div>
  </div>

  <div class="grid3">
    <!-- 左主区 -->
    <div class="col-main">
      <div class="card">
        <div class="card-h"><b>本周数据</b></div>
        <div class="range-line" id="wk-range"></div>
        <div class="kpi-big"><span class="num" id="wk-count">--</span><span class="delta" id="wk-delta"></span></div>
        <div class="sub-grid">
          <div class="s">本周现款合计<b id="wk-cash">--</b></div>
          <div class="s">本周订单笔数<b id="wk-cnt2">--</b></div>
          <div class="s">VAB 会员<b id="vab-n">--</b></div>
        </div>
        <div class="donut-row">
          <div class="donut" id="donut"><div class="c"><b id="dkpi">--</b>渠道</div></div>
          <div class="legend" id="donut-legend"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><b>本月速览</b><span class="more" id="mon-range"></span></div>
        <div class="sub-grid">
          <div class="s">本月现款合计<b id="mon-cash">--</b></div>
          <div class="s">本月订单笔数<b id="mon-cnt">--</b></div>
          <div class="s">今日笔数<b id="td-cnt">--</b></div>
          <div class="s">本月日均笔数<b id="mon-avg">--</b></div>
          <div class="s">渠道分类数<b id="mon-ch">--</b></div>
          <div class="s">数据更新<b id="data-ts">--</b></div>
        </div>
      </div>

      <div class="card" style="grid-column:1/-1;">
        <div class="card-h"><b>常见应用</b></div>
        <div class="apps" id="apps"></div>
      </div>

      <div class="card" style="grid-column:1/-1;">
        <div class="card-h"><b>近两周业绩对比</b><span class="more">现款支付口径</span></div>
        <div class="bars" id="bars"></div>
      </div>
    </div>

    <!-- 右侧栏（账号显示已迁移至壳层顶栏右上角，此处不再放用户卡） -->
    <div class="col-side">
      <div class="card">
        <div class="card-h"><b>快捷入口</b></div>
        <div class="links" id="links"></div>
      </div>
      <div class="card">
        <div class="card-h"><b>平台动态</b></div>
        <div class="notes">
          <div class="note"><b>10-19</b>短视频组记录行已隐藏，金额并入「其他」。</div>
          <div class="note"><b>10-17</b>全站筛选区统一改版上线，控件/折叠/分页全面规范。</div>
          <div class="note"><b>10-17</b>初诊版新增「1 年新客规则」：导入近一年明细自动判定。</div>
          <div class="note"><b>10-16</b>账号与角色权限管理上线，支持按角色分配模块与操作。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/shared/auth-gate.js?v=20261020c"></script>
<script>
(function(){
  'use strict';
  var NAVY = ['#002060','#1e3a8a','#4a7bb5','#7fa3d1','#a9c3e3','#c9d8ee','#3658d3','#8a97b8'];

  /* ---------- 工具 ---------- */
  function $(id){ return document.getElementById(id); }
  function money(n){ return '¥' + (Math.round(n*100)/100).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function mondayOf(d){ var x=new Date(d); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
  function inRange(t, a, b){ return t>=a && t<=b; }

  /* ---------- 读取订单数据（同源 localStorage；跨域兜底走壳层 dp:request 桥） ---------- */
  function loadOrders(cb){
    var raw = null;
    try{ raw = localStorage.getItem('dailyPerformance_orders'); }catch(e){}
    if(raw){ try{ var obj=JSON.parse(raw); if(obj && obj.orders) return cb(obj); }catch(e){} }
    // 兜底：向壳层要（dp:persist 桥协议）
    try{
      var onMsg = function(ev){
        var d = ev.data || {};
        if(d.type === 'dp:payload' && d.key === 'dailyPerformance_orders'){
          window.removeEventListener('message', onMsg);
          var obj = (typeof d.value === 'string') ? JSON.parse(d.value) : d.value;
          cb(obj && obj.orders ? obj : {orders:[],cutoff:null});
        }
      };
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type:'dp:request', key:'dailyPerformance_orders' }, '*');
      setTimeout(function(){ window.removeEventListener('message', onMsg); cb({orders:[],cutoff:null}); }, 1200);
    }catch(e){ cb({orders:[],cutoff:null}); }
  }

  function parseDay(row){
    var t = row['收款时间'] || row.payTime || '';
    var m = String(t).match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[1]+'-'+m[2]+'-'+m[3]) : '';
  }
  function cash(row){ var v = Number(row['现款支付']); return isFinite(v) ? v : 0; }

  /* ---------- 渲染 ---------- */
  function render(obj){
    var orders = (obj && obj.orders) || [];
    var now = new Date();
    var wkStart = mondayOf(now);
    var wkEnd = new Date(now); wkEnd.setHours(23,59,59,999);
    var lastWkStart = new Date(wkStart); lastWkStart.setDate(lastWkStart.getDate()-7);
    var lastWkEnd = new Date(wkStart); lastWkEnd.setSeconds(-1);
    var monStart = new Date(now.getFullYear(), now.getMonth(), 1);
    var todayStr = dstr(now);

    var wk=[], lastWk=[], mon=[], today=[];
    orders.forEach(function(r){
      var day = parseDay(r); if(!day) return;
      var t = new Date(day+'T00:00:00'); if(isNaN(t)) return;
      if(inRange(t, wkStart, wkEnd)) wk.push(r);
      else if(inRange(t, lastWkStart, lastWkEnd)) lastWk.push(r);
      if(t >= monStart) mon.push(r);
      if(day === todayStr) today.push(r);
    });
    var wkCash = wk.reduce(function(s,r){ return s+cash(r); },0);
    var lwCash = lastWk.reduce(function(s,r){ return s+cash(r); },0);
    var monCash = mon.reduce(function(s,r){ return s+cash(r); },0);

    $('wk-count').textContent = wk.length;
    $('wk-cnt2').textContent = wk.length;
    $('wk-cash').textContent = money(wkCash);
    $('mon-cash').textContent = money(monCash);
    $('mon-cnt').textContent = mon.length;
    $('td-cnt').textContent = today.length;
    $('mon-avg').textContent = mon.length ? (mon.length / now.getDate()).toFixed(1) : '0';
    $('wk-range').textContent = dstr(wkStart) + ' ~ ' + dstr(now);
    $('mon-range').textContent = dstr(monStart).slice(0,7);
    // 较上周（笔数）
    var dEl = $('wk-delta');
    if(lastWk.length > 0){
      var pct = Math.round((wk.length - lastWk.length) / lastWk.length * 100);
      dEl.textContent = '较上周 ' + (pct>=0?'+':'') + pct + '%';
      dEl.className = 'delta ' + (pct>=0?'up':'down');
    } else { dEl.textContent = '上周无数据'; dEl.className='delta'; }

    // VAB 会员数
    try{
      var vab = JSON.parse(localStorage.getItem('dailyPerformance_vab') || 'null');
      var n = vab && vab.list ? vab.list.length : (vab && vab.rows ? vab.rows.length : 0);
      $('vab-n').textContent = n || 0;
    }catch(e){ $('vab-n').textContent = 0; }

    // 本月渠道分类数（修复：id=mon-ch 此前从未被填充，一直显示 --）
    try{
      var monCh = {};
      mon.forEach(function(r){ var c = r['客户来源渠道分类'] || '（空白）'; monCh[c] = 1; });
      $('mon-ch').textContent = Object.keys(monCh).length;
    }catch(e){ $('mon-ch').textContent = 0; }

    // 渠道分类占比（本周，top5）
    var byCls = {};
    wk.forEach(function(r){ var c = r['客户来源渠道分类'] || '（空白）'; byCls[c] = (byCls[c]||0)+1; });
    var entries = Object.keys(byCls).map(function(k){ return [k, byCls[k]]; })
      .sort(function(a,b){ return b[1]-a[1]; });
    var top = entries.slice(0,5), restN = entries.slice(5).reduce(function(s,e){ return s+e[1]; },0);
    if(restN > 0) top.push(['其他', restN]);
    var total = wk.length || 1, acc = 0, segs = [], html = '';
    top.forEach(function(e, i){
      var deg = Math.round(e[1] / total * 360);
      acc += deg;
      segs.push(NAVY[i % NAVY.length] + ' ' + (acc - deg) + 'deg ' + acc + 'deg');
      html += '<div class="li"><span class="dot" style="background:'+NAVY[i%NAVY.length]+'"></span>'
        + e[0] + ' · ' + e[1] + ' 笔</div>';
    });
    if(top.length){
      $('donut').style.background = 'conic-gradient(' + segs.join(',') + ')';
      $('dkpi').textContent = wk.length;
      $('donut-legend').innerHTML = html;
    } else {
      $('donut-legend').innerHTML = '<div class="empty">本周暂无订单数据</div>';
    }

    // 近两周对比条形（按日）
    var maxV = 0, dayMap = {};
    wk.concat(lastWk).forEach(function(r){ var d=parseDay(r); if(d){ dayMap[d]=(dayMap[d]||0)+cash(r); } });
    Object.keys(dayMap).forEach(function(k){ if(dayMap[k]>maxV) maxV=dayMap[k]; });
    var days = [];
    for(var i=13;i>=0;i--){ var dt=new Date(now); dt.setDate(dt.getDate()-i); days.push(dstr(dt)); }
    $('bars').innerHTML = days.map(function(d){
      var v = dayMap[d] || 0;
      return '<div class="bar-row"><span class="lab">'+d.slice(5)+'</span>'
        + '<span class="track"><span class="fill" style="width:'+(maxV? Math.round(v/maxV*100):0)+'%"></span></span>'
        + '<span class="val">'+money(v)+'</span></div>';
    }).join('');

    // 数据更新时间
    try{
      var ts = localStorage.getItem('dailyPerformance_snap_ts');
      if(ts){ var dt=new Date(Number(ts)); $('data-ts').textContent = isNaN(dt)?'--':(String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')); }
      else $('data-ts').textContent = orders.length ? '本次加载' : '--';
    }catch(e){ $('data-ts').textContent='--'; }
  }

  /* ---------- 快捷应用 / 入口（跳壳层 hash） ---------- */
  var APPS = [
    {nm:'日业绩报表', ico:'📈', bg:'linear-gradient(135deg,#002060,#1e3a8a)', hash:'#dp-std'},
    {nm:'日业绩·初诊', ico:'🩺', bg:'linear-gradient(135deg,#1e3a8a,#3658d3)', hash:'#dp-chuzhen'},
    {nm:'客量业绩报表', ico:'📊', bg:'linear-gradient(135deg,#0d6e5f,#2E7D5B)', hash:'#data-statistics'},
    {nm:'预约到店', ico:'📅', bg:'linear-gradient(135deg,#0d5e8a,#1a7fc1)', hash:'#ds-appt'},
    {nm:'月度分析', ico:'📆', bg:'linear-gradient(135deg,#6b4fd8,#8a6ff0)', hash:'#monthly-analysis'},
    {nm:'医管考核', ico:'🏥', bg:'linear-gradient(135deg,#8a3ab5,#a85ccf)', hash:'#medical-assessment'},
    {nm:'账号与角色', ico:'🔐', bg:'linear-gradient(135deg,#7a4a1e,#a8712f)', hash:'#account-roles'},
  ];
  function gotoHash(h){
    try{
      if(window.top !== window){ window.top.location.hash = h; }
      else { location.hash = h; }
    }catch(e){ location.hash = h; }
  }
  function renderApps(){
    $('apps').innerHTML = APPS.map(function(a){
      return '<div class="app" data-hash="'+a.hash+'"><span class="ico" style="background:'+a.bg+'">'+a.ico+'</span><span class="nm">'+a.nm+'</span></div>';
    }).join('');
    $('links').innerHTML = APPS.map(function(a){
      return '<div class="lnk" data-hash="'+a.hash+'"><span class="ico">'+a.ico+'</span>'+a.nm+'<span class="tail">进入 →</span></div>';
    }).join('');
    document.querySelectorAll('[data-hash]').forEach(function(el){
      el.addEventListener('click', function(){ gotoHash(el.getAttribute('data-hash')); });
    });
  }

  /* ---------- 启动 ---------- */
  var now = new Date();
  var week = ['日','一','二','三','四','五','六'];
  $('today').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · 星期'+week[now.getDay()];
  var h = now.getHours();
  $('greet').firstChild.textContent = (h<6?'凌晨好':h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好');

  renderApps();
  loadOrders(render);
})();
</script>
</body>
</html>
