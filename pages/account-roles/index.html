<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>账号与角色权限管理</title>
<style>
  :root{
    --c-bg:#eef1f6; --c-card:#fff; --c-border:#dbe3ee; --c-border-soft:#e9eef6;
    --c-head:#002060; --c-head-2:#1e3a8a; --c-accent:#3658d3; --c-text:#1f2d4d;
    --c-muted:#7a8aa6; --c-success:#1f8a4a; --c-warn:#a85b04; --c-error:#b3261e;
    --radius:14px; --radius-sm:9px; --shadow-card:0 1px 2px rgba(31,45,77,.05),0 8px 24px rgba(31,45,77,.07);
    --font-sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:var(--font-sans);background:var(--c-bg);color:var(--c-text);font-size:14px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px;}
  h1{font-size:19px;color:var(--c-head);margin:0 0 3px;}
  .sub{color:var(--c-muted);font-size:12.5px;margin-bottom:14px;}
  .banner{margin-bottom:12px;padding:10px 15px;border-radius:var(--radius-sm);font-size:13px;display:flex;gap:8px;align-items:flex-start;}
  .banner.warn{background:#fff4e0;border:1px solid #d4a017;color:var(--c-warn);}
  .banner.ok{background:#e3f5ea;border:1px solid #b7e3c7;color:var(--c-success);}
  /* ① 本机当前操作员条 */
  .opbar{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 16px;display:flex;gap:12px;align-items:center;margin-bottom:14px;box-shadow:var(--shadow-card);flex-wrap:wrap;}
  .opbar .lab{font-size:12.5px;color:var(--c-muted);font-weight:600;white-space:nowrap;}
  .label{font-size:12.5px;color:var(--c-muted);margin-right:6px;font-weight:500;}
  .input,.select{padding:7px 11px;border:1px solid var(--c-border);border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--c-text);font-family:inherit;outline:none;}
  .input:focus,.select:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(54,88,211,.12);}
  .mut{font-size:11.5px;color:var(--c-muted);margin-top:4px;}
  .chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:#e8eefc;color:var(--c-accent);font-weight:600;white-space:nowrap;}
  .chip.cur{background:#e3f5ea;color:var(--c-success);}
  /* 主从两栏 */
  .layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }
  .side{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card);}
  .side h2{font-size:13px;font-weight:700;color:var(--c-head);margin:0;padding:11px 14px 9px;border-bottom:2px solid var(--c-border-soft);display:flex;justify-content:space-between;align-items:center;}
  .side h2 .mini{font-size:11px;color:var(--c-accent);cursor:pointer;font-weight:500;background:none;border:none;font-family:inherit;padding:0;}
  .side h2 .mini:hover{text-decoration:underline;}
  .rlist{list-style:none;margin:0;padding:6px;}
  .rlist li{padding:9px 11px;border-radius:var(--radius-sm);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid transparent;}
  .rlist li:hover{background:#f2f6fd;}
  .rlist li.on{background:#e8eefc;border-color:#c3d2f5;}
  .rlist li .nm{font-size:13px;font-weight:600;color:var(--c-head);display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rlist li .cnt{font-size:11px;color:var(--c-muted);white-space:nowrap;}
  .rlist li.empty-li{cursor:default;color:var(--c-muted);font-size:12.5px;justify-content:center;padding:14px;}
  .rlist li.empty-li:hover{background:none;}
  .newrow{display:block;width:100%;text-align:center;padding:9px;border:none;border-top:1px dashed var(--c-border);background:#fbfdff;color:var(--c-accent);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .newrow:hover{background:#f2f6fd;}
  /* 右侧编辑器 */
  .editor{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card);}
  .editor > .eh{padding:13px 18px 11px;border-bottom:2px solid var(--c-border-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .editor > .eh h2{font-size:15px;color:var(--c-head);margin:0;}
  .editor > .eb{padding:16px 18px 18px;}
  .namerow{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .grp-title{font-size:12px;font-weight:700;color:var(--c-head);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .grp-title::before{content:"";width:3px;height:13px;background:linear-gradient(180deg,var(--c-head),var(--c-head-2));border-radius:2px;}
  .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 14px;margin-bottom:14px;}
  @media (max-width:640px){ .checks{grid-template-columns:1fr 1fr;} }
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:6px 9px;border:1px solid var(--c-border);border-radius:8px;background:#fbfdff;transition:all .12s;}
  .chk:hover{border-color:#c3d2f5;}
  .chk.on{border-color:#c3d2f5;background:#eef3fd;}
  .chk input{accent-color:var(--c-accent);}
  .placeholder{color:var(--c-muted);font-size:13px;padding:36px 12px;text-align:center;}
  .hint{font-size:11.5px;color:var(--c-accent);background:#eef3fd;border:1px dashed #c3d2f5;border-radius:8px;padding:7px 11px;margin-bottom:12px;}
  .foot{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--c-border-soft);padding-top:13px;margin-top:4px;}
  .btn{cursor:pointer;border:1px solid var(--c-border);background:#fff;border-radius:var(--radius-sm);padding:8px 14px;color:var(--c-text);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .15s ease;white-space:nowrap;}
  .btn:hover{border-color:var(--c-accent);color:var(--c-accent);box-shadow:0 2px 8px rgba(54,88,211,.12);}
  .btn-primary{background:var(--c-head);color:#fff;border-color:var(--c-head);}
  .btn-primary:hover{background:var(--c-head-2);color:#fff;border-color:var(--c-head-2);}
  .btn-danger{border-color:#f1c2bd;color:var(--c-error);}
  .btn-danger:hover{background:#fde4e4;color:var(--c-error);border-color:#e7a39c;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .savebar{position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--c-border);padding:11px 18px;display:flex;gap:10px;justify-content:flex-end;backdrop-filter:blur(4px);border-radius:var(--radius);margin-top:16px;box-shadow:var(--shadow-card);}
  .empty{color:var(--c-muted);font-size:13px;padding:18px;text-align:center;}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#1f2d4d;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--c-error);}
  .toast.ok{background:var(--c-success);}
</style>
<link rel="stylesheet" href="/shared/filterbar.css?v=20261019a">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#123c73">

<body>
<div class="wrap" id="app">
  <h1>🔐 账号与角色权限管理</h1>
  <div class="sub">管理与维护操作员档案、角色及细粒度权限（菜单可见性 / 导入 / 导出 / 清除 / 编辑）。左侧点选、右侧编辑；配置随云端共享账号同步，全组织生效。</div>

  <div id="banner-slot"></div>

  <div id="no-permission" class="editor" style="display:none;">
    <div class="eh"><h2>⛔ 无访问权限</h2></div>
    <div class="eb">
      <p class="sub" style="margin:0;">当前账号未分配「管理账号与角色」权限。请联系系统管理员为您开通，或使用具备该权限的账号登录。</p>
    </div>
  </div>

  <div id="admin-ui" style="display:none;">

    <!-- ① 本机当前操作员（顶条） -->
    <div class="opbar">
      <span class="lab">🖥 本机当前操作员</span>
      <select id="current-op" class="select"></select>
      <span id="current-op-info" class="chip"></span>
      <span class="mut" style="margin-left:auto;">共用云账号多人场景：选择「此刻是谁在操作本机」</span>
    </div>

    <!-- 主从两栏：左列表 / 右编辑器 -->
    <div class="layout">
      <aside class="side">
        <h2>角色 <span class="mut" id="role-count"></span><button type="button" class="mini" id="role-new-mini">＋ 新建</button></h2>
        <ul class="rlist" id="role-list"></ul>
        <button type="button" class="newrow" id="role-new">＋ 新建角色</button>
        <h2 style="border-top:1px solid var(--c-border-soft);">操作员 <span class="mut" id="op-count"></span></h2>
        <ul class="rlist" id="op-list"></ul>
        <button type="button" class="newrow" id="op-new">＋ 新建操作员</button>
      </aside>

      <section class="editor">
        <div class="eh" id="editor-head"></div>
        <div class="eb" id="editor-body"></div>
      </section>
    </div>

  </div>

  <div id="save-bar" class="savebar" style="display:none;">
    <span id="save-status" class="mut" style="margin-right:auto;"></span>
    <button class="btn" id="reset-btn">放弃修改</button>
    <button class="btn btn-primary" id="save-btn">💾 保存配置</button>
  </div>
</div>
<div class="toast" id="toast"></div>
