<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>美大店铺日数据</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --c-bg:#eef1f6; --c-card:#fff; --c-border:#dbe3ee; --c-border-soft:#e9eef6;
    --c-head:#002060; --c-head-2:#1e3a8a; --c-accent:#3658d3; --c-text:#1f2d4d;
    --c-muted:#7a8aa6; --c-accent-soft:#eef3fd;
    --radius:14px; --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(31,45,77,.05),0 8px 24px rgba(31,45,77,.07);
    --font-sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;

    /* ===== 原 Excel 色板（严格取色，勿改） ===== */
    --xl-g1:#1F497D;   /* 美大店铺 / 责任人 */
    --xl-g2:#17375E;   /* 店铺评分、客量分组 */
    --xl-g3:#4472C4;   /* 统计口径 + 第3行字段行 */
    --xl-g4:#31859B;   /* 业绩（黑字） */
    --xl-g5:#60497A;   /* 美团数据 */
    --xl-g6:#76923C;   /* 投产比 */
    --xl-g7:#C55A11;   /* 美团榜单维护及客资转化 */
    --xl-today-a:#B8CCE4;  /* 当日数据 B–N */
    --xl-today-b:#D9E2F3;  /* 当日数据 O–Z */
    --xl-cum-a:#B8CCE4;    /* 本月累计 C–N */
    --xl-cum-b:#E2EFDA;    /* 本月累计 O–Z */
    --xl-orange:#FCE4D6;   /* 投产比+好评区 */
    --xl-sum:#FFF2CC;      /* 合计行 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:var(--font-sans);background:var(--c-bg);color:var(--c-text);font-size:14px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:100%;margin:0 auto;padding:18px 16px 70px;}
  h1{font-size:19px;color:var(--c-head);margin:0 0 12px;}

  .panel{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:14px;}
  .panel h2{font-size:14.5px;color:var(--c-head);margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .panel h2 .tag{font-size:11px;font-weight:400;color:var(--c-muted);}

  .toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;}
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--c-border);
    background:#fff;color:var(--c-head);font-family:inherit;font-size:13px;cursor:pointer;transition:background-color .12s,border-color .12s;}
  .btn:hover{border-color:var(--c-head);background:#f6f9ff;}
  .btn-primary{background:var(--c-head);border-color:var(--c-head);color:#fff;}
  .btn-primary:hover{background:#0b2f70;color:#fff;}
  .btn-ghost{color:var(--c-muted);}
  #btn-clear{margin-left:auto;}
  .btn-ghost:hover{color:#b3261e;border-color:#b3261e;background:#fff5f5;}
  .file-meta{font-size:12px;color:var(--c-muted);align-self:center;}
  .file-meta.ok{color:#1f8a4a;}
  .file-meta.err{color:#b3261e;}
  .sep{width:1px;height:22px;background:var(--c-border);align-self:center;}

  .fld{display:inline-flex;flex-direction:column;gap:3px;}
  .fld > span.lb{font-size:11.5px;color:var(--c-muted);}
  .ctl{height:32px;border:1px solid var(--c-border);border-radius:8px;padding:0 9px;font-family:inherit;font-size:13px;
    color:var(--c-text);background:#fff;outline:none;}
  .ctl:focus{border-color:var(--c-accent);box-shadow:0 0 0 2px rgba(54,88,211,.12);}
  .seg{display:inline-flex;border:1px solid var(--c-border);border-radius:8px;overflow:hidden;height:32px;}
  .seg button{height:30px;padding:0 13px;border:0;background:#fff;color:var(--c-muted);font-family:inherit;font-size:12.5px;cursor:pointer;}
  .seg button + button{border-left:1px solid var(--c-border);}
  .seg button.active{background:var(--c-head);color:#fff;}

  /* ===== 概览卡 ===== */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px;}
  @media (max-width:1180px){ .kpis{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 12px;background:linear-gradient(180deg,#fbfcff,#f4f7fd);}
  .kpi .k{font-size:11.5px;color:var(--c-muted);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .v{font-size:17px;font-weight:700;color:var(--c-head);font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
  .kpi .v small{font-size:11px;font-weight:400;color:var(--c-muted);margin-left:3px;}
  .kpi .v.rate{color:#0f766e;}

  /* ===== 数据表 ===== */
  .tbl-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:9px 12px;background:#fbfcff;border-bottom:1px solid var(--c-border-soft);}
  .tbl-head .tt{font-size:14.5px;font-weight:700;color:var(--c-head);}
  .tbl-head .sep{height:20px;}
  .tbl-head .file-meta{margin-left:auto;}
  .btn[disabled]{opacity:.55;cursor:progress;}
  .tbl-wrap{border:0;border-radius:var(--radius-sm);overflow:auto;max-height:calc(100vh - 290px);background:#fff;}
  /* 34 列宽表：table-layout:fixed 必须配合 width:max-content，否则列宽被容器压扁（列数多时文字会被迫竖排） */
  table.xl{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:12px;}
  table.xl th,table.xl td{border-right:1px solid #d6dde8;border-bottom:1px solid #d6dde8;padding:5px 6px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  table.xl thead th{position:sticky;z-index:5;font-weight:700;color:#fff;white-space:normal;line-height:1.25;}
  /* 三行表头逐层吸附：top 必须等于上方各行实际高度之和，否则滚动时错位 */
  table.xl thead tr:nth-child(1) th{top:0;height:30px;}
  table.xl thead tr:nth-child(2) th{top:30px;height:34px;}
  table.xl thead tr:nth-child(3) th{top:64px;height:50px;font-size:11px;line-height:1.22;font-weight:600;}
  table.xl .t-title{background:#fff;color:#1f2d4d;font-size:14px;letter-spacing:.5px;text-align:center;border-bottom:2px solid #9aa9c0;}
  /* 表头分组配色 */
  .g1{background:var(--xl-g1);} .g2{background:var(--xl-g2);} .g3{background:var(--xl-g3);}
  .g4{background:var(--xl-g4);color:#000 !important;} .g5{background:var(--xl-g5);}
  .g6{background:var(--xl-g6);} .g7{background:var(--xl-g7);}
  /* 首列冻结（左右滚动时首列不动） */
  table.xl tbody td.c-store,table.xl tfoot td.c-store{position:sticky;left:0;z-index:4;text-align:left;white-space:normal;line-height:1.35;}
  table.xl thead th.c-store{position:sticky;left:0;z-index:7;}
  /* 冻结列底色跟随所在行（sticky 必须不透明，否则横向滚动会透出后列内容） */
  table.xl tbody td.c-store,table.xl tfoot td.c-store{font-weight:600;color:var(--c-head);box-shadow:2px 0 0 rgba(31,45,77,.10);}
  tr.r-today td.c-store{background:var(--xl-today-a);}
  tr.r-cum td.c-store{background:var(--xl-cum-a);}
  tr.r-sum td.c-store{background:var(--xl-sum);}
  /* 行分组底色 */
  tr.r-today td{background:var(--xl-today-a);}
  tr.r-today td.z-b{background:var(--xl-today-b);}
  tr.r-today td.z-c{background:var(--xl-orange);}
  tr.r-cum td{background:var(--xl-cum-a);}
  tr.r-cum td.z-b{background:var(--xl-cum-b);}
  tr.r-cum td.z-c{background:var(--xl-orange);}
  tr.r-sum td{background:var(--xl-sum);font-weight:700;color:#7a4a00;}
  tr.r-sum td.z-c{background:var(--xl-orange);}
  tr.r-sum td.c-store{background:var(--xl-sum);}
  /* 合计行底部固定（纵向滚动时始终可见）：需不透明底色 + 高于表体首列(z4) */
  table.xl tfoot td{position:sticky;bottom:0;z-index:6;}
  table.xl tfoot td.c-store{position:sticky;left:0;bottom:0;z-index:8;}
  /* 合计行加高：数字与上下框线留出呼吸空间（原 5px 内边距 → 行高 27px 偏挤） */
  table.xl tfoot tr.r-sum td{box-shadow:inset 0 2px 0 #d8b24a;padding-top:9px;padding-bottom:9px;font-size:12.5px;}
  /* 单元格内容 */
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  td .adot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#1f8a4a;margin-right:4px;vertical-align:2px;}
  td .pdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#3658d3;margin-right:4px;vertical-align:2px;}
  td.dash{color:#9aa9c0;}
  td.fb{color:#8a6a2a;font-style:italic;}
  td.editable{cursor:cell;}
  td.editable:hover{outline:2px solid var(--c-accent);outline-offset:-2px;}
  /* 手工覆盖过的格子：曾用 inset 3px 蓝条标记，用户要求去掉，故不再画任何标记（类名保留，便于以后换样式） */
  td.manual{}

  /* ===== 编辑模式（点「编辑」按钮开启） ===== */
  /* 可编辑范围以浅蓝蒙版标出，不改变原有行/列底色（用 background-image 叠加，不动 background-color） */
  body.edit-mode table.xl tbody td[data-edit],
  body.edit-mode table.xl tfoot td[data-edit]{
    background-image:linear-gradient(rgba(54,88,211,.07),rgba(54,88,211,.07));
    cursor:text;
  }
  body.edit-mode table.xl td[data-edit]:hover{
    outline:2px solid var(--c-accent);outline-offset:-2px;
    background-image:linear-gradient(rgba(54,88,211,.16),rgba(54,88,211,.16));
  }
  /* 店铺名被改过的标记（默认藏蓝，改过后变强调蓝） */
  td.c-store.name-edited{color:var(--c-accent);}
  .btn.on{background:var(--c-accent);border-color:var(--c-accent);color:#fff;}
  .btn.on:hover{background:#2a47b8;border-color:#2a47b8;color:#fff;}
  td.c-period{font-weight:700;color:var(--c-head);background:#eef2fa !important;}

  /* ===== 合并目标模式（点「合并目标」开启） ===== */
  /* 只有四个月度目标列可点选：合并模式下给它们加紫色蒙版（叠加 background-image，不改底色） */
  body.merge-mode table.xl tbody td[data-field="tgtAmt"],
  body.merge-mode table.xl tbody td[data-field="tgtVis"],
  body.merge-mode table.xl tbody td[data-field="roiTgt"],
  body.merge-mode table.xl tbody td[data-field="revTgt"]{
    background-image:linear-gradient(rgba(122,91,211,.10),rgba(122,91,211,.10));
    cursor:pointer;
  }
  body.merge-mode table.xl tbody td[data-field="tgtAmt"]:hover,
  body.merge-mode table.xl tbody td[data-field="tgtVis"]:hover,
  body.merge-mode table.xl tbody td[data-field="roiTgt"]:hover,
  body.merge-mode table.xl tbody td[data-field="revTgt"]:hover{
    background-image:linear-gradient(rgba(122,91,211,.22),rgba(122,91,211,.22));
    outline:2px solid #7a5bd3;outline-offset:-2px;
  }
  /* 起点格：加深 + 实线紫框，提示「再点第二家店」 */
  body.merge-mode table.xl tbody td.merge-anchor{
    background-image:linear-gradient(rgba(122,91,211,.30),rgba(122,91,211,.30)) !important;
    outline:2.4px solid #5b3fb0 !important;outline-offset:-2.4px;
  }
  /* 已合并的目标格：不额外加框/底色，与普通单元格保持完全一致的格式
     （合并只体现为跨门店合并单元格本身；2026-11-04 用户确认去掉紫色外框） */

  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:11.5px;color:var(--c-muted);}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08);}

  /* Toast */
  .toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#1f2d4d;color:#fff;padding:10px 18px;border-radius:10px;
    font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.22);z-index:9999;opacity:0;transition:opacity .22s;pointer-events:none;max-width:80vw;}
  .toast.show{opacity:1;}
  .toast.ok{background:#1f8a4a;} .toast.err{background:#b3261e;} .toast.warn{background:#a85b04;}

  .empty{padding:44px 20px;text-align:center;color:var(--c-muted);font-size:13px;line-height:1.9;}
  .empty b{color:var(--c-head);}

  @media (max-width:640px){
    .wrap{padding:12px 10px 60px;}
    .panel{padding:12px;}
    .tbl-wrap{max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch;}
    .toolbar{gap:8px 10px;}
    /* 窄屏下分隔线会单独占一行变成竖杠，标题徽标也会把表头挤成两行 */
    .sep{display:none;}
    .panel h2 .tag{display:none;}
    .legend{gap:4px 10px;}
    .toast{max-width:92vw;font-size:12.5px;padding:8px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>美大店铺日数据</h1>

  <!-- ① 数据导入 -->
  <div class="panel">
    <h2>① 数据导入 <span class="tag">订单表 → 业绩/客量；七大店铺总表 → 评分、榜单、投产比、好评；店铺日报表 → 评分、推广费、曝光/下单/核销/回复时长；平台三表 → 单表补数；门店报表 → 仅推广费</span></h2>
    <div class="toolbar">
      <input type="file" id="file-orders" accept=".xlsx,.xls" hidden />
      <button class="btn" id="btn-orders">📁 上传订单表</button>
      <span id="orders-meta" class="file-meta">未导入</span>
      <span class="sep"></span>
      <input type="file" id="file-stores" accept=".xlsx,.xls" hidden />
      <button class="btn" id="btn-stores">📊 上传七大店铺总表</button>
      <span id="stores-meta" class="file-meta">未导入</span>
      <span class="sep"></span>
      <input type="file" id="file-platform" accept=".xlsx,.xls,.csv" multiple hidden />
      <button class="btn btn-primary" id="btn-platform" title="可一次多选：店铺日报表 / 客流 / 在线咨询 / 门店交易 / 门店报表（推广费），按表头自动识别类型">📥 上传平台数据（可多选）</button>
      <span id="platform-meta" class="file-meta">未导入</span>
      <span class="sep"></span>
      <input type="file" id="file-promo" accept=".xlsx,.xls" hidden />
      <button class="btn" id="btn-promo" title="只传推广费时用这个；也可以直接在「上传平台数据」里一起选中，会自动识别">📊 上传门店报表（推广费）</button>
      <span id="promo-meta" class="file-meta">未导入</span>
      <span class="sep"></span>
      <button class="btn btn-ghost" id="btn-clear">清除本页数据</button>
    </div>
  </div>

  <!-- ② 日期与口径 -->
  <div class="panel">
    <h2>② 日期与统计口径</h2>
    <div class="toolbar">
      <label class="fld"><span class="lb">报表日期</span>
        <span style="display:inline-flex;align-items:center;gap:6px;">
          <input type="date" id="report-date" class="ctl" />
          <button class="btn" id="btn-today" title="报表日期切到今天（真实日期）" style="padding:0 11px;">今天</button>
          <button class="btn" id="btn-latest" title="跳到最新有数据的一天" style="padding:0 11px;">最新</button>
        </span>
      </label>
      <label class="fld"><span class="lb">行显示</span>
        <span class="seg" id="period-seg">
          <button data-p="both" class="active">当日 + 月累计</button>
          <button data-p="today">仅当日</button>
          <button data-p="cum">仅月累计</button>
        </span>
      </label>
      <label class="fld"><span class="lb">取数方式</span>
        <span class="seg" id="src-seg">
          <button data-s="auto" class="active">自动汇总</button>
          <button data-s="sheet">仅总表</button>
        </span>
      </label>
    </div>
  </div>

  <!-- ③ 概览 -->
  <div class="kpis" id="kpis"></div>

  <!-- ④ 主表 -->
  <div class="panel" style="padding:0;overflow:hidden;">
    <div class="tbl-head">
      <span class="tt">④ 报表</span>
      <span class="sep"></span>
      <button class="btn" id="btn-export-xlsx" title="导出带样式的 Excel（列宽、底色、框线、合并单元格、冻结窗格均与页面一致）">⬇ 导出 Excel</button>
      <button class="btn" id="btn-export-png" title="导出整表图片（2 倍高清，颜色与页面完全一致）">🖼 导出图片</button>
      <span class="sep"></span>
      <button class="btn" id="btn-edit" title="开启编辑模式：单击表格内任意单元格（含店铺名）即可修改">✏️ 编辑</button>
      <button class="btn" id="btn-merge-tgt" title="合并相邻门店的目标列：点同列的第一家店、再点第二家店 → 并成一格，设置一次全部生效；再点合并格即拆分">🔗 合并目标</button>
      <button class="btn btn-ghost" id="btn-clear-edit" title="清除本页所有手动修改（双击或编辑模式下改过的值，含店铺名与目标合并设置）">↺ 清除修改</button>
    </div>
    <div class="tbl-wrap" id="tbl-wrap">
      <div class="empty" id="tbl-empty">
        尚未导入任何数据。<br />
        请先上传 <b>订单表</b>（自动计算业绩 / 客量）和 / 或 <b>七大店铺总表</b>（评分、美团漏斗、好评等）。
      </div>
      <table class="xl" id="tbl" style="display:none;">
        <colgroup id="tbl-colgroup"></colgroup>
        <thead id="tbl-thead"></thead>
        <tbody id="tbl-body"></tbody>
        <tfoot id="tbl-foot"></tfoot>
      </table>
    </div>
  </div>

  <div class="legend">
    <span><i style="background:var(--xl-g1)"></i>美大店铺 / 责任人</span>
    <span><i style="background:var(--xl-g2)"></i>评分·榜单 / 客量</span>
    <span><i style="background:var(--xl-g3)"></i>字段名</span>
    <span><i style="background:var(--xl-g4)"></i>业绩</span>
    <span><i style="background:var(--xl-g5)"></i>美团数据</span>
    <span><i style="background:var(--xl-g6)"></i>投产比</span>
    <span><i style="background:var(--xl-g7)"></i>榜单维护及客资转化</span>
    <span><i style="background:var(--xl-today-a)"></i>当日数据行</span>
    <span><i style="background:var(--xl-cum-b)"></i>本月累计行</span>
    <span><i style="background:var(--xl-sum)"></i>合计行</span>
    <span><i style="background:#1f8a4a;border-radius:50%"></i>订单自动计算</span>
    <span><i style="background:#3658d3;border-radius:50%"></i>平台三表汇总</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/cloudbase-bridge.js?v=20261031b"></script>
<script src="/shared/rbac.js?v=20261028a"></script>
<script src="/shared/auth-gate.js?v=20261029a"></script>
<script>document.write('<script src="assets/app.js?v=' + Date.now() + '"><\/script>');</script>
<script>document.write('<script src="assets/export.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
