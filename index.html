<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据统计平台</title>
  <!-- SITE_VER 为唯一权威版本号；每次重新发布时同步修改此处与 app.js 的消费逻辑，用于穿透浏览器启发式缓存 -->
  <script>window.SITE_VER = '20261104c';</script>
  <link rel="stylesheet" href="style.css?v=20261028b" />
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#123c73">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="海蓓医管">
<script>if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }); }</script>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">数据统计平台</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <button class="sidebar-toggle" id="sidebar-toggle" title="收起 / 展开侧边栏">«</button>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="菜单">☰</button>
        <div class="crumb" id="crumb">数据统计平台</div>
        <div class="top-actions">
          <span class="clock" id="clock"></span>
          <span id="sa-badge-slot"></span><!-- 账号徽章顶栏内联挂载点（auth-gate.js 探测注入） -->
        </div>
      </header>
      <div class="tabbar" id="tabbar"></div>
      <section class="content" id="content">
        <div class="loading">从左侧选择一个功能模块开始（可同时打开多个）</div>
      </section>
    </main>
    <div class="overlay" id="overlay"></div>
  </div>
  <script src="/shared/cloudbase-bridge.js?v=20261031b"></script>
  <script src="/shared/data-backup.js?v=20261104c"></script>
  <script src="/shared/rbac.js?v=20261028b"></script>
  <script src="app.js?v=20261104c"></script>
<script src="/shared/auth-gate.js?v=20261029a"></script>
</body>
</html>
