<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据统计平台</title>
  <!-- SITE_VER 为唯一权威版本号；每次重新发布时同步修改此处与 app.js 的消费逻辑，用于穿透浏览器启发式缓存 -->

  <link rel="stylesheet" href="style.css?v=20261012a" />
